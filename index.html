<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Docusign IAM — Discovery Questionnaire</title>
<meta name="description" content="Conditional discovery questionnaire for Docusign IAM Agreement Manager.">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap');

/* ── tokens ── */
:root{
  --indigo:#4338CA; --indigo-mid:#4F46E5; --indigo-light:#6366F1;
  --indigo-pale:#DDDCFB; --indigo-bg:#EEF2FF;
  --ink:#141B2E; --ink-mid:#3F4A5C; --ink-soft:#5F6A7D;
  --border:#E7E9F2; --border-mid:#D7DAE7;
  --bg:#F4F5FA; --surface:#fff;
  --ok:#059669; --ok-bg:#ECFDF5; --ok-light:#D1FAE5;
  --bad:#DC2626; --bad-bg:#FEF2F2;
  --warn:#D97706; --warn-bg:#FEF3C7;
  --gold:#F59E0B;
  --sidebar:284px;
  --font:'Plus Jakarta Sans',-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);font-size:15px;line-height:1.6;color:var(--ink);
  background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--indigo);text-decoration:none}
a:hover{color:#312E9E}
::selection{background:var(--indigo-pale);color:var(--ink)}
input:focus,textarea:focus{outline:none;border-color:var(--indigo-light)!important;
  box-shadow:0 0 0 3px rgba(99,102,241,.16)!important}
select:focus{outline:none;border-color:var(--indigo-light)!important;
  box-shadow:0 0 0 3px rgba(99,102,241,.16)!important}
input::placeholder,textarea::placeholder{color:#6B7688}
select{appearance:none;-webkit-appearance:none}

/* ── layout ── */
.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar);background:var(--surface);border-right:1px solid var(--border);
  position:fixed;top:0;bottom:0;left:0;display:flex;flex-direction:column;z-index:40;
  transition:transform .22s ease}
.main{flex:1;margin-left:var(--sidebar);min-width:0;display:flex;flex-direction:column}

/* ── sidebar brand ── */
.brand{padding:18px 20px 16px;display:flex;align-items:center;gap:10px;
  border-bottom:1px solid var(--border)}
.brand-logo{width:28px;height:28px;border-radius:9px;
  background:linear-gradient(145deg,var(--indigo-light),var(--indigo));
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:12.5px;font-weight:800;flex-shrink:0;
  box-shadow:0 6px 14px -8px rgba(67,56,202,.9)}
.brand-text{min-width:0}
.brand-name{font-size:13px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.brand-sub{font-size:12px;font-weight:600;color:var(--ink-soft);margin-top:1px}

/* ── sidebar progress ── */
.progress-wrap{padding:18px 20px;border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,#F8F9FE,var(--surface))}
.progress-wrap h2{font-size:17px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
.progress-wrap .sub{font-size:12.5px;color:var(--ink-soft);margin-top:4px}
.pbar-row{display:flex;align-items:baseline;gap:8px;margin-top:16px}
.pbar-pct{font-size:26px;font-weight:800;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;line-height:1;color:var(--indigo)}
.pbar-pct span{font-size:15px;font-weight:700;color:var(--ink-soft)}
.pbar-label{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);
  margin-left:auto;font-variant-numeric:tabular-nums}
.pbar{height:6px;border-radius:99px;background:var(--border);margin-top:10px;overflow:hidden}
.pbar i{display:block;height:6px;border-radius:99px;width:0;
  background:linear-gradient(90deg,var(--indigo-light),var(--indigo));transition:width .35s ease}

/* ── sidebar nav ── */
.nav{flex:1;overflow-y:auto;padding:12px 12px 20px}
.nav::-webkit-scrollbar{width:6px}
.nav::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;border:2px solid var(--surface)}
.nav-group{display:flex;align-items:center;gap:7px;padding:20px 8px 8px}
.nav-dot{width:6px;height:6px;border-radius:2px}
.nav-group-label{font-size:11.5px;font-weight:700;letter-spacing:.11em;
  text-transform:uppercase;color:#6B7688}
.nav a{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;
  color:var(--ink-mid);text-decoration:none;font-size:13.5px;font-weight:500;
  letter-spacing:-.005em;transition:background .13s,color .13s;white-space:nowrap}
.nav a:hover{background:var(--bg);color:var(--ink)}
.nav a.active{background:var(--indigo-bg);color:var(--indigo);font-weight:600}
.nav a .cnt{margin-left:auto;flex:none;font-family:var(--mono);font-size:11.5px;font-weight:500;
  font-variant-numeric:tabular-nums;padding:2px 6px;border-radius:6px}
.nav a .cnt.pending{background:var(--border);color:var(--ink-soft)}
.nav a .cnt.done{background:var(--ok-light);color:var(--ok)}
.nav a.flagged-link::after{content:'';width:6px;height:6px;border-radius:999px;
  background:var(--bad);flex:none}

/* ── sidebar footer ── */
.sidebar-footer{padding:14px 16px;border-top:1px solid var(--border);
  display:flex;flex-direction:column;gap:10px}
.sidebar-footer .user{font-size:11.5px;color:var(--ink-soft);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── topbar ── */
.topbar{position:sticky;top:0;height:60px;background:rgba(255,255,255,.88);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--border);
  padding:0 32px;display:flex;gap:16px;align-items:center;z-index:30;flex-wrap:wrap}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:9px;
  background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:0 12px}
.search svg{color:#6B7688;flex-shrink:0}
.search input{flex:1;min-width:60px;border:none;background:transparent;
  font-size:14px;padding:9px 0;box-shadow:none!important;outline:none!important}
.save-status{display:flex;align-items:center;gap:7px;flex:none;padding:5px 11px;
  border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.save-status.idle{display:none}
.save-status.saving{background:#FEF3C7;color:var(--warn)}
.save-status.saved{background:var(--ok-bg);color:var(--ok)}
.save-status.error{background:var(--bad-bg);color:var(--bad)}
.save-dot{width:6px;height:6px;border-radius:999px;flex:none}
.saving .save-dot{background:var(--warn);animation:pulse .9s infinite}
.saved .save-dot{background:var(--ok)}
.error .save-dot{background:var(--bad)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* ── buttons ── */
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 12px;border-radius:9px;
  border:1px solid var(--border-mid);background:var(--surface);font-size:12.5px;
  font-weight:600;color:var(--ink-mid);transition:all .13s;white-space:nowrap}
.btn:hover{border-color:#B9BFD1;color:var(--ink)}
.btn.primary{background:linear-gradient(180deg,var(--indigo-mid),var(--indigo));color:#fff;
  border-color:transparent;box-shadow:0 1px 2px rgba(20,27,46,.1),0 8px 18px -10px rgba(67,56,202,.8)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-soft);padding:0}
.btn.ghost:hover{color:var(--indigo)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.menuwrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);
  border:1px solid var(--border);border-radius:11px;
  box-shadow:0 10px 30px rgba(20,27,46,.12);min-width:190px;padding:5px;
  display:none;z-index:60}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;padding:8px 11px;
  border-radius:7px;font-size:13.5px;color:var(--ink-mid)}
.menu button:hover{background:var(--bg);color:var(--ink)}
.menu .sep{height:1px;background:var(--border);margin:4px 0}
.hamburger{display:none}

/* ── content ── */
.content{padding:36px 32px 120px;max-width:1060px;width:100%}
.head .kicker{font-size:11.5px;font-weight:700;letter-spacing:.11em;
  text-transform:uppercase;color:var(--indigo)}
.head h2{font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:10px}
.head p{color:var(--ink-soft);margin-top:7px;max-width:68ch;font-size:14px}
.toolrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:16px 0 4px}
.chip{font-size:12px;padding:5px 12px;border-radius:99px;
  border:1px solid var(--border);background:var(--surface);
  color:var(--ink-soft);font-weight:600;cursor:pointer}
.chip.on{background:var(--indigo);color:#fff;border-color:var(--indigo)}

/* ── question card ── */
.q{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:20px 22px;margin-bottom:10px;
  box-shadow:0 1px 2px rgba(20,27,46,.04);transition:box-shadow .15s}
.q:hover{box-shadow:0 3px 12px rgba(20,27,46,.07)}
.q.answered{border-left:3px solid var(--ok)}
.q.gated{opacity:.5}
.q-top{display:flex;gap:10px;align-items:flex-start}
.ref{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--indigo);
  background:var(--indigo-bg);padding:3px 8px;border-radius:6px;white-space:nowrap;flex-shrink:0}
.qtext{font-weight:700;font-size:15.5px;line-height:1.38;letter-spacing:-.015em;color:var(--ink)}
.why{font-size:13.5px;color:var(--ink-soft);margin-top:9px;line-height:1.55}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:11px;padding:3px 8px;border-radius:5px;font-weight:600}
.tag.type{background:var(--bg);color:var(--ink-soft)}
.tag.trig{background:var(--indigo-bg);color:var(--indigo)}
.tag.route{background:var(--warn-bg);color:var(--warn)}
.lbl{font-family:var(--mono);font-size:10px;letter-spacing:.1em;font-weight:600;
  color:#6B7688;margin-bottom:6px;display:block;text-transform:uppercase}
.answer{margin-top:14px}
.field{display:flex;gap:8px;align-items:flex-start}
select,textarea,input[type=text],input[type=number]{width:100%;padding:10px 12px;
  border:1px solid var(--border-mid);border-radius:9px;background:var(--surface);
  font-size:14px;color:var(--ink)}
textarea{resize:vertical;min-height:64px}
.editopts{flex:0 0 auto;padding:10px 14px;border:1px solid var(--border-mid);
  border-radius:9px;background:var(--surface);font-size:12.5px;font-weight:600;
  color:var(--indigo);white-space:nowrap}
.editopts:hover{background:var(--indigo-bg);border-color:var(--indigo-pale)}
.multi{display:flex;flex-wrap:wrap;gap:7px}
.opt{padding:7px 14px;border:1px solid var(--border-mid);border-radius:99px;
  background:var(--surface);font-size:13px;font-weight:500;color:var(--ink-mid);transition:all .1s}
.opt:hover{border-color:var(--indigo-light);color:var(--indigo)}
.opt.sel{background:var(--indigo);color:#fff;border-color:transparent}
.notes{margin-top:10px}
.cons{margin-top:12px;background:var(--bad-bg);border-left:3px solid var(--bad);
  padding:9px 13px;border-radius:0 9px 9px 0;font-size:12.5px;color:#7F1D1D;line-height:1.55}
.cons b{font-weight:700;color:var(--bad)}
.gatenote{margin-top:11px;background:var(--indigo-bg);border-left:3px solid var(--indigo-light);
  padding:9px 13px;border-radius:0 9px 9px 0;font-size:12.5px;color:var(--indigo);line-height:1.55}

/* ── interview ── */
.int-group-head{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;
  font-weight:600;color:#6B7688;padding:24px 0 10px;
  display:flex;align-items:center;gap:12px;text-transform:uppercase}
.int-group-head::after{content:'';flex:1;height:1px;background:var(--border)}
.int-complete{text-align:center;padding:40px;background:var(--ok-bg);
  border:1.5px solid var(--ok);border-radius:14px;margin-bottom:100px}
.int-complete b{display:block;font-size:18px;font-weight:800;color:var(--ok);margin-bottom:6px}
.int-complete p{font-size:14px;color:var(--ink-soft)}
.ifloat{position:fixed;bottom:22px;right:24px;display:flex;align-items:center;gap:11px;
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:10px 16px;box-shadow:0 8px 24px rgba(20,27,46,.14);z-index:50}
.ifloat .ipct{font-family:var(--mono);font-size:12px;color:#6B7688;font-weight:500}
.ifloat .ibar{height:4px;width:88px;border-radius:99px;background:var(--border);overflow:hidden}
.ifloat .ibar i{display:block;height:100%;
  background:linear-gradient(90deg,var(--indigo-light),var(--indigo));transition:width .35s}
@keyframes qslide{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.q-new{animation:qslide .3s ease}

/* ── considerations ── */
.cons-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:18px 20px;margin-bottom:10px;box-shadow:0 1px 2px rgba(20,27,46,.04)}
.cons-card.on{border-left:3px solid var(--bad);background:var(--bad-bg)}
.status{font-family:var(--mono);font-size:10.5px;font-weight:700;padding:3px 8px;
  border-radius:5px;letter-spacing:.06em}
.status.on{background:var(--bad);color:#fff}
.status.off{background:var(--bg);color:#6B7688}
.cons-card h4{font-size:15px;font-weight:700;margin:9px 0 4px;color:var(--ink)}
.cons-card .act{margin-top:10px;background:var(--warn-bg);padding:10px 13px;
  border-radius:9px;font-size:13px;color:var(--warn);line-height:1.5}

/* ── dashboard ── */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:22px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:18px;box-shadow:0 1px 2px rgba(20,27,46,.04)}
.card .ci{width:26px;height:4px;border-radius:99px}
.card .n{font-size:34px;font-weight:800;letter-spacing:-.035em;font-variant-numeric:tabular-nums;
  line-height:1;margin-top:14px}
.card .l{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink-soft);margin-top:9px}
.card.alert .n{color:var(--bad)}
table.grid{width:100%;border-collapse:collapse;background:var(--surface);
  border-radius:14px;overflow:hidden;border:1px solid var(--border)}
table.grid th{background:var(--ink);color:#fff;text-align:left;
  padding:10px 14px;font-size:11.5px;font-weight:700;letter-spacing:.04em}
table.grid td{padding:10px 14px;border-top:1px solid var(--border);font-size:13.5px}
table.grid tr:nth-child(even) td{background:var(--bg)}
.mini{height:4px;border-radius:99px;background:var(--border);overflow:hidden;min-width:80px}
.mini i{display:block;height:100%;
  background:linear-gradient(90deg,var(--indigo-light),var(--indigo))}

/* ── session list ── */
.ss-topbar{height:62px;background:var(--surface);border-bottom:1px solid var(--border);
  padding:0 32px;display:flex;align-items:center;justify-content:space-between;
  gap:16px;position:sticky;top:0;z-index:30}
.ss-brand{display:flex;align-items:center;gap:10px}
.ss-lm{width:28px;height:28px;border-radius:9px;
  background:linear-gradient(145deg,var(--indigo-light),var(--indigo));
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:12.5px;font-weight:800;
  box-shadow:0 6px 14px -8px rgba(67,56,202,.9)}
.ss-name{font-size:14px;font-weight:700;letter-spacing:-.01em}
.ss-div{width:1px;height:16px;background:var(--border)}
.ss-disc{font-size:13.5px;font-weight:600;color:#6B7688}
.ss-chip{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;
  border-radius:99px;background:var(--bg);border:1px solid var(--border)}
.ss-avatar{width:22px;height:22px;border-radius:99px;background:var(--indigo-pale);
  color:var(--indigo);display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;font-family:var(--mono)}
.ss-email{font-size:12.5px;font-weight:500;color:var(--ink-mid)}
.sessions-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.sess-card{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;
  padding:20px;cursor:pointer;transition:all .15s;
  box-shadow:0 1px 2px rgba(20,27,46,.04);position:relative}
.sess-card:hover{border-color:var(--indigo-pale);
  box-shadow:0 4px 18px rgba(79,70,229,.1);transform:translateY(-1px)}
.sess-card.complete{border-left:3px solid var(--ok)}
.sess-card.draft{border-left:3px solid var(--gold)}
.sess-card h3{font-size:16px;font-weight:800;letter-spacing:-.02em;
  color:var(--ink);line-height:1.25;margin-bottom:10px}
.status-pill{font-family:var(--mono);font-size:10px;font-weight:600;
  padding:3px 8px;border-radius:5px;letter-spacing:.04em}
.status-pill.draft{background:var(--warn-bg);color:var(--warn)}
.status-pill.complete{background:var(--ok-bg);color:var(--ok)}
.sc-meta{font-size:12.5px;color:#6B7688;margin-bottom:12px;
  display:flex;flex-direction:column;gap:3px;line-height:1.45}
.sess-pbar{height:3px;border-radius:99px;background:var(--border);overflow:hidden;margin-bottom:7px}
.sess-pbar i{display:block;height:100%;
  background:linear-gradient(90deg,var(--indigo-light),var(--indigo))}
.sc-foot{display:flex;justify-content:space-between;align-items:center}
.sc-foot .pct{font-family:var(--mono);font-size:11.5px;color:#6B7688;font-weight:500}
.sc-foot .flags{font-size:11.5px;color:var(--bad);font-weight:600}
.sc-del{position:absolute;top:14px;right:14px;width:26px;height:26px;border-radius:7px;
  border:1px solid var(--border);background:var(--surface);font-size:12px;
  display:flex;align-items:center;justify-content:center;color:#6B7688;
  opacity:0;transition:opacity .12s}
.sess-card:hover .sc-del{opacity:1}
.sc-del:hover{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:20px;align-items:center}
.filters input,.filters select{height:36px;padding:0 12px;border:1px solid var(--border);
  border-radius:9px;background:var(--surface);font-size:13.5px}
.empty-state{text-align:center;padding:64px 20px;color:#6B7688;grid-column:1/-1}
.empty-state b{display:block;font-size:18px;color:var(--ink);margin-bottom:8px}
.empty-state p{font-size:14px;margin-bottom:22px}

/* ── login ── */
.login-wrap{min-height:100vh;display:flex;background:var(--surface)}
.login-left{flex:1.05;min-width:0;position:relative;overflow:hidden;
  background:radial-gradient(900px 520px at 12% 8%,rgba(122,90,248,.55),transparent 60%),
             radial-gradient(700px 480px at 88% 92%,rgba(14,165,233,.42),transparent 62%),
             linear-gradient(155deg,#312E9E 0%,var(--indigo) 48%,#5B21B6 100%);
  padding:56px 52px;display:flex;flex-direction:column;justify-content:space-between;color:#fff}
.login-left .ll-brand{display:flex;align-items:center;gap:11px}
.ll-lm{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.28);display:flex;align-items:center;
  justify-content:center;font-size:13px;font-weight:800}
.ll-name{font-size:13.5px;font-weight:700}
.ll-badge{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:rgba(255,255,255,.62);padding:4px 8px;border-radius:6px;background:rgba(255,255,255,.12)}
.login-left h1{font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1.06;
  text-wrap:pretty;max-width:440px}
.ll-sub{font-size:16px;line-height:1.65;color:rgba(255,255,255,.76);
  margin-top:20px;max-width:420px;text-wrap:pretty}
.ll-pills{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px}
.ll-pill{padding:7px 13px;border-radius:999px;background:rgba(255,255,255,.13);
  border:1px solid rgba(255,255,255,.2);font-size:12.5px;font-weight:600}
.ll-stats{display:flex;gap:36px}
.ll-stat .sn{font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:-.02em}
.ll-stat .sl{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:rgba(255,255,255,.58);margin-top:5px}
.login-right{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;
  padding:48px 40px}
.login-box{width:100%;max-width:368px}
.login-box h2{font-size:30px;font-weight:800;letter-spacing:-.025em;line-height:1.15}
.login-box .sub{font-size:14.5px;color:#6B7688;margin-top:9px;line-height:1.6}
.form-row{margin-top:32px;display:flex;flex-direction:column;gap:18px}
.form-field{display:flex;flex-direction:column;gap:7px}
.form-field label{font-size:12.5px;font-weight:600;color:var(--ink-mid)}
.form-field input{height:46px;padding:0 14px;border:1px solid var(--border-mid);
  border-radius:10px;font-size:15px;background:var(--surface)}
.login-err{font-size:13.5px;line-height:1.55;color:var(--bad);background:var(--bad-bg);
  border:1px solid #FECDCA;border-radius:10px;padding:11px 14px;margin-bottom:14px;display:none}
.login-err.show{display:block}
.login-hint{margin-top:26px;font-size:12.5px;color:#6B7688;line-height:1.6}

/* ── modal ── */
.overlay{position:fixed;inset:0;background:rgba(20,27,46,.45);
  display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.overlay.open{display:flex}
.modal{background:var(--surface);border-radius:15px;max-width:560px;width:100%;
  max-height:88vh;display:flex;flex-direction:column;
  box-shadow:0 24px 60px rgba(20,27,46,.28)}
.modal header{padding:20px 22px;border-bottom:1px solid var(--border)}
.modal header h3{font-size:17px;font-weight:800;letter-spacing:-.02em}
.modal header p{font-size:13px;color:#6B7688;margin-top:4px}
.modal .bd{padding:20px 22px;overflow-y:auto}
.modal footer{padding:14px 22px;border-top:1px solid var(--border);
  display:flex;gap:8px;justify-content:flex-end}
.optrow{display:flex;gap:7px;align-items:center;margin-bottom:8px}
.optrow input{flex:1;height:36px}
.iconbtn{width:34px;height:34px;border:1px solid var(--border);border-radius:8px;
  background:var(--surface);display:flex;align-items:center;justify-content:center;
  font-size:13px;color:#6B7688;flex-shrink:0}
.iconbtn:hover{background:var(--bg)}
.iconbtn.del:hover{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}

/* ── new session modal ── */
.ns-field{margin-bottom:14px}
.ns-field label{display:block;font-size:12px;font-weight:600;letter-spacing:.04em;
  color:var(--ink-mid);margin-bottom:5px;text-transform:uppercase}
.ns-field input{height:40px;padding:0 12px;border:1px solid var(--border-mid);
  border-radius:9px;width:100%;font-size:14px;background:var(--surface)}

/* ── loading ── */
.loading-screen{min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:20px;background:var(--bg)}
.loading-screen .lmark{width:34px;height:34px;border-radius:11px;
  background:linear-gradient(145deg,var(--indigo-light),var(--indigo));
  box-shadow:0 10px 24px -12px rgba(67,56,202,.8)}
.loading-screen .lbar{width:130px;height:3px;border-radius:99px;
  background:var(--border);overflow:hidden}
.loading-screen .lfill{height:3px;border-radius:99px;background:var(--indigo-light);
  animation:sweep 1.15s cubic-bezier(.4,0,.2,1) infinite}
@keyframes sweep{0%{width:0;margin-left:0}50%{width:60%;margin-left:20%}100%{width:0;margin-left:130px}}
.loading-screen .llabel{font-size:12px;font-weight:600;letter-spacing:.06em;
  color:#5F6A7D;text-transform:uppercase}

/* ── toast ── */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(70px);
  background:var(--ink);color:#fff;padding:11px 20px;border-radius:11px;
  font-size:13.5px;font-weight:600;z-index:200;
  transition:transform .24s cubic-bezier(.4,0,.2,1);
  box-shadow:0 8px 24px rgba(20,27,46,.28)}
.toast.show{transform:translateX(-50%) translateY(0)}

@media(max-width:900px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .hamburger{display:inline-flex}
  .content{padding:20px}
  .login-left{display:none}
  .sessions-grid{grid-template-columns:1fr}
}
@media print{
  .sidebar,.topbar,.toolrow,.editopts,.sc-del,.ifloat{display:none!important}
  .main{margin-left:0}
  .q{break-inside:avoid;box-shadow:none}
}
</style>
</head>
<body>

<div id="root">
  <div class="loading-screen"><div class="lmark"></div><div class="lbar"><div class="lfill"></div></div><div class="llabel">Loading workspace</div></div>
</div>
<div class="toast" id="toast"></div>

<script>window.IAM_DATA={"questions":[{"ref":"G1.01","tier":"gate","group":"gate","section":"Account & Edition","question":"Which Docusign IAM edition is the account licensed for?","why":"Edition determines which modules are available at all. Obligation Management, CLM interoperability and custom extraction limits are all edition-gated.","atype":"Single select","options":["IAM Essentials","IAM Standard","IAM Pro","IAM Enterprise","IAM for Sales","Not yet purchased"],"guidance":"","triggerText":"Always ask","showIf":null,"routing":"If 'Not yet purchased' -> flag as pre-sales, complete Tier 2 only","considerations":"Custom extraction limits differ by edition (Pro/Enterprise/Sales: 50 combined, 15 custom types max)."},{"ref":"G1.02","tier":"gate","group":"gate","section":"Account & Edition","question":"Is Agreement Manager already provisioned and live on the account?","why":"Determines whether this is a net-new implementation or an optimisation of an existing deployment.","atype":"Yes / No","options":["Yes","No"],"guidance":"","triggerText":"Always ask","showIf":null,"routing":"If No -> ask G1.03. If Yes -> skip to G1.04","considerations":""},{"ref":"G1.03","tier":"gate","group":"gate","section":"Account & Edition","question":"What is the target provisioning date, and who owns the Docusign relationship?","why":"Historical ingestion begins at provisioning and can take over a week, so this anchors the whole plan.","atype":"Free text","options":[],"guidance":"","triggerText":"G1.02 = No","showIf":{"all":[{"ref":"G1.02","op":"eq","value":"No"}]},"routing":"","considerations":"Historical ingestion runs automatically at provisioning and is all-or-nothing."},{"ref":"G1.04","tier":"gate","group":"gate","section":"Account & Edition","question":"Is this a single Docusign account, or multiple accounts under one organisation?","why":"Agreement Manager permissions and audit logs are managed per account, not at organisation level.","atype":"Single select","options":["Single account","Multiple accounts","Unsure"],"guidance":"","triggerText":"Always ask","showIf":null,"routing":"If 'Multiple accounts' -> ask G1.05","considerations":"Audit events are captured at account level. Agreement Manager is issued at account level, not org level."},{"ref":"G1.05","tier":"gate","group":"gate","section":"Account & Entity","question":"Which accounts are in scope, and do agreements need to be visible across account boundaries?","why":"There is no cross-account agreement visibility; this often forces a consolidation decision.","atype":"Free text","options":[],"guidance":"","triggerText":"G1.04 = Multiple accounts","showIf":{"all":[{"ref":"G1.04","op":"eq","value":"Multiple accounts"}]},"routing":"","considerations":"No cross-account repository. Consolidation or separate deployments may be required."},{"ref":"G1.06","tier":"gate","group":"gate","section":"Region & Compliance","question":"Which datacenter region is the account provisioned in?","why":"Region drives language support behaviour and the 'English (Global)' vs 'English (U.S.)' distinction.","atype":"Single select","options":["US","EU","Canada","Australia","Japan","Unsure"],"guidance":"","triggerText":"Always ask","showIf":null,"routing":"","considerations":"Data may be processed outside the provisioned region. Obligations AI runs on a U.S. server."},{"ref":"G1.07","tier":"gate","group":"gate","section":"Region & Compliance","question":"Is the account FedRAMP or GovRAMP?","why":"Email ingestion is not supported on FedRAMP/GovRAMP accounts, which removes an entire intake route.","atype":"Yes / No","options":["Yes","No","Unsure"],"guidance":"","triggerText":"Always ask","showIf":null,"routing":"If Yes -> skip M1.07-M1.09 (email ingestion)","considerations":"Email attachment ingestion is NOT supported on FedRAMP/GovRAMP accounts."},{"ref":"G1.08","tier":"gate","group":"gate","section":"Region & Compliance","question":"Are there data residency or sovereignty requirements that restrict where agreement data may be processed?","why":"AI processing may occur outside the provisioned region; this must be disclosed early.","atype":"Free text","options":[],"guidance":"","triggerText":"Always ask","showIf":null,"routing":"","considerations":"Documented limitation: data may be processed outside the provisioned region."},{"ref":"G1.09","tier":"gate","group":"gate","section":"Volume & Scale","question":"Approximately how many completed agreements exist in Docusign eSignature today?","why":"Tests the account against the historical ingestion ceiling.","atype":"Number","options":[],"guidance":"","triggerText":"Always ask","showIf":null,"routing":"If > 100,000 -> ask G1.10","considerations":"Ingestion ceiling: 500,000 (North America) / 100,000 (International)."},{"ref":"G1.10","tier":"gate","group":"gate","section":"Volume & Scale","question":"Is the account provisioned as North American or International?","why":"Sets which ingestion ceiling applies (500K vs 100K).","atype":"Single select","options":["North America","International","Unsure"],"guidance":"","triggerText":"G1.09 > 100000","showIf":{"all":[{"ref":"G1.09","op":"gt","value":100000}]},"routing":"","considerations":"If volume exceeds the ceiling, ingestion is all-or-nothing; selective historical ingestion is not generally available."},{"ref":"G1.11","tier":"gate","group":"gate","section":"Volume & Scale","question":"What is the expected annual growth in completed agreements?","why":"Determines headroom against ceilings and sizing of the ongoing data review effort.","atype":"Number","options":[],"guidance":"","triggerText":"Always ask","showIf":null,"routing":"","considerations":""},{"ref":"G1.12","tier":"gate","group":"gate","section":"Language","question":"Which languages do the in-scope agreements appear in?","why":"AI insight coverage varies significantly by language; several attribute families are English-only.","atype":"Multi select","options":["English (US)","English (other)","French","German","Spanish","Brazilian Portuguese","Japanese","Other"],"guidance":"","triggerText":"Always ask","showIf":null,"routing":"If anything other than English (US) selected -> ask G1.13","considerations":"AI supports 6 languages. Payment Obligations are English (U.S.) only. Assignment/Liability/Jurisdiction are English+German+French only."},{"ref":"G1.13","tier":"gate","group":"gate","section":"Language","question":"Roughly what proportion of the estate is in each non-English language?","why":"Quantifies how much of the repository will have reduced AI coverage and need manual entry.","atype":"Free text","options":[],"guidance":"","triggerText":"G1.12 includes any non-English","showIf":{"any":[{"ref":"G1.12","op":"containsAny","value":["English (other)","French","German","Spanish","Brazilian Portuguese","Japanese","Other"]}]},"routing":"","considerations":"Custom types/fields are auto-supported in English (Global) only. Reports built on unsupported attributes will not populate."},{"ref":"G1.14","tier":"gate","group":"gate","section":"Existing Estate","question":"Is Docusign CLM in use, or planned?","why":"CLM changes deduplication behaviour, adds the CLM Attributes pane, and has its own interoperability roadmap.","atype":"Single select","options":["In use today","Planned","No","Unsure"],"guidance":"","triggerText":"Always ask","showIf":null,"routing":"If 'In use today' or 'Planned' -> ask M11.01-M11.04","considerations":"CLM has its own deduplication. CLM interoperability documents are excluded from duplicate detection."},{"ref":"G1.15","tier":"gate","group":"gate","section":"Existing Estate","question":"Are there agreements stored outside Docusign that need to be brought in?","why":"Triggers the entire migration and bulk metadata workstream.","atype":"Yes / No","options":["Yes","No","Unsure"],"guidance":"","triggerText":"Always ask","showIf":null,"routing":"If Yes -> complete Module 12 (Migration)","considerations":"Bulk upload requires an admin-granted permission. 190 MB per file, 255-character filenames."},{"ref":"G1.16","tier":"gate","group":"gate","section":"Users","question":"Approximately how many users need access, and what is the split across administrators, contract managers, and view-only users?","why":"Drives the permissions model and licence requirements.","atype":"Free text","options":[],"guidance":"","triggerText":"Always ask","showIf":null,"routing":"","considerations":"Free participants can only see their own agreements and cannot use repository-wide features."},{"ref":"G1.17","tier":"gate","group":"gate","section":"Users","question":"Are any intended users on free/participant licences rather than full licences?","why":"Free participants cannot use most Agreement Manager features, and dashboards will load empty for them.","atype":"Yes / No","options":["Yes","No","Unsure"],"guidance":"","triggerText":"Always ask","showIf":null,"routing":"If Yes -> flag licence gap in Considerations","considerations":"Free participants need a full licence plus permission for most features; access to others' agreements only via shared sets."},{"ref":"G1.18","tier":"gate","group":"gate","section":"Timeline","question":"What is the target go-live date, and is a phased rollout expected?","why":"Ingestion and processing timelines can run to weeks; this validates feasibility early.","atype":"Free text","options":[],"guidance":"","triggerText":"Always ask","showIf":null,"routing":"","considerations":"Large data sets can take over a week to process. eSignature-ingested docs queue longer at month/year end (4-5 days)."},{"ref":"B2.01","tier":"business","group":"business","section":"Drivers","question":"What is the primary business driver for deploying Agreement Manager?","why":"Anchors scope. A renewals-driven deployment looks very different from a compliance-driven one.","atype":"Multi select","options":["Visibility / findability","Renewal capture","Risk & compliance","Cost reduction","Audit readiness","M&A due diligence","Other"],"guidance":"","triggerText":"Always ask","showIf":null,"routing":"Use the answer to prioritise which domain modules are in scope","considerations":""},{"ref":"B2.02","tier":"business","group":"business","section":"Drivers","question":"What specifically goes wrong today because agreement data is hard to access?","why":"Surfaces the concrete pain that success will be measured against.","atype":"Free text","options":[],"guidance":"","triggerText":"Always ask","showIf":null,"routing":"","considerations":""},{"ref":"B2.03","tier":"business","group":"business","section":"Drivers","question":"Has the organisation missed renewals, auto-renewed unintentionally, or missed notice periods in the last 24 months?","why":"Renewal pain is the most common and most quantifiable driver.","atype":"Yes / No","options":["Yes","No","Unsure"],"guidance":"","triggerText":"Always ask","showIf":null,"routing":"If Yes -> prioritise Module 8 (Renewals) and quantify the loss","considerations":"Auto-extension requires accurate Expiration Date, Renewal Type and Renewal Term."},{"ref":"B2.04","tier":"business","group":"business","section":"Stakeholders","question":"Who is the executive sponsor, and who is the day-to-day process owner?","why":"Data review is an ongoing operational commitment and needs a named owner.","atype":"Free text","options":[],"guidance":"","triggerText":"Always ask","showIf":null,"routing":"","considerations":""},{"ref":"B2.05","tier":"business","group":"business","section":"Stakeholders","question":"Which departments will use the repository, and what does each need from it?","why":"Departmental needs map directly to agreement sets, dashboards and permission design.","atype":"Free text","options":[],"guidance":"","triggerText":"Always ask","showIf":null,"routing":"","considerations":""},{"ref":"B2.06","tier":"business","group":"business","section":"Stakeholders","question":"Who currently acts as gatekeeper for agreement requests, and what is their volume?","why":"Identifies the bottleneck the deployment is meant to relieve, and a likely champion.","atype":"Free text","options":[],"guidance":"","triggerText":"Always ask","showIf":null,"routing":"","considerations":""},{"ref":"B2.07","tier":"business","group":"business","section":"Use Cases","question":"What are the top three questions the business needs to answer from agreement data?","why":"These become the acceptance tests for reporting and field configuration.","atype":"Free text","options":[],"guidance":"","triggerText":"Always ask","showIf":null,"routing":"Map each answer to required fields in Module 3","considerations":""},{"ref":"B2.08","tier":"business","group":"business","section":"Compliance","question":"Are there regulatory or audit drivers (SOX, GDPR, industry-specific) shaping requirements?","why":"Drives activity log, retention and access control requirements.","atype":"Free text","options":[],"guidance":"","triggerText":"Always ask","showIf":null,"routing":"If Yes -> ask M2.09-M2.11 (audit and access logging)","considerations":"Activity logs display 200 events max; CSV download capped at 5,000 rows; timestamps in UTC."},{"ref":"B2.09","tier":"business","group":"business","section":"Current State","question":"What tools are used today to track agreements (spreadsheets, shared drives, another CLM)?","why":"Identifies migration sources and what is being decommissioned.","atype":"Free text","options":[],"guidance":"","triggerText":"Always ask","showIf":null,"routing":"If a system is named -> complete Module 12 (Migration)","considerations":""},{"ref":"B2.10","tier":"business","group":"business","section":"Current State","question":"Is there an existing agreement taxonomy, naming convention, or metadata standard?","why":"Determines how much of the type/field model already exists versus needs designing.","atype":"Yes / No","options":["Yes","No","Partially"],"guidance":"","triggerText":"Always ask","showIf":null,"routing":"If Yes or Partially -> request the documentation before Module 3","considerations":""},{"ref":"B2.11","tier":"business","group":"business","section":"Success","question":"What does success look like at 3, 6 and 12 months, and how will it be measured?","why":"Without measurable targets the deployment cannot be signed off.","atype":"Free text","options":[],"guidance":"","triggerText":"Always ask","showIf":null,"routing":"","considerations":""},{"ref":"B2.12","tier":"business","group":"business","section":"Success","question":"Who will validate AI-surfaced data, and how much time can they commit each week?","why":"Data review is the single most underestimated effort in these deployments.","atype":"Free text","options":[],"guidance":"","triggerText":"Always ask","showIf":null,"routing":"","considerations":"Agreements remain in the review queue until every suggested value is accepted or corrected."},{"ref":"M1.01","tier":"modules","group":"M1","section":"M1 Ingestion","question":"Does this module apply? Confirm agreements will be ingested or uploaded into Agreement Manager.","why":"Module gate.","atype":"Yes / No","options":["Yes","No"],"guidance":"","triggerText":"Always ask","showIf":null,"routing":"If No -> skip to Module 2","considerations":""},{"ref":"M1.02","tier":"modules","group":"M1","section":"M1 Ingestion","question":"Should all completed eSignature envelopes flow into Agreement Manager automatically?","why":"Automatic ingestion is the default and cannot be selectively filtered without a request.","atype":"Yes / No","options":["Yes","No","Unsure"],"guidance":"","triggerText":"M1.01 = Yes","showIf":{"all":[{"ref":"M1.01","op":"eq","value":"Yes"}]},"routing":"If No -> ask M1.03","considerations":"Ingestion filtering is not generally available; request via the account team. Ingestion is all-or-nothing."},{"ref":"M1.03","tier":"modules","group":"M1","section":"M1 Ingestion","question":"Which envelopes should be excluded, and on what basis?","why":"Establishes whether a filtering request to Docusign is needed before go-live.","atype":"Free text","options":[],"guidance":"","triggerText":"M1.02 = No","showIf":{"all":[{"ref":"M1.02","op":"eq","value":"No"}]},"routing":"Raise a filtering request with the Docusign account team","considerations":"Selective historical ingestion is not supported as standard."},{"ref":"M1.04","tier":"modules","group":"M1","section":"M1 Ingestion","question":"Do both sent and received envelopes need to be captured?","why":"Both sync by default; confirms expectations rather than changes behaviour.","atype":"Yes / No","options":["Yes","No"],"guidance":"","triggerText":"M1.01 = Yes","showIf":{"all":[{"ref":"M1.01","op":"eq","value":"Yes"}]},"routing":"","considerations":"Both sent and received envelopes sync by default."},{"ref":"M1.05","tier":"modules","group":"M1","section":"M1 Ingestion","question":"Will users upload documents directly from their devices?","why":"Single upload (up to 5 files) needs no special permission; more does.","atype":"Yes / No","options":["Yes","No"],"guidance":"","triggerText":"M1.01 = Yes","showIf":{"all":[{"ref":"M1.01","op":"eq","value":"Yes"}]},"routing":"If Yes -> ask M1.06","considerations":"Single upload capped at 5 files. Files under 190 MB, filenames under 255 characters."},{"ref":"M1.06","tier":"modules","group":"M1","section":"M1 Ingestion","question":"Will any users need to upload more than 5 files at a time?","why":"Bulk upload requires an admin-granted, user-level-only permission.","atype":"Yes / No","options":["Yes","No"],"guidance":"","triggerText":"M1.05 = Yes","showIf":{"all":[{"ref":"M1.05","op":"eq","value":"Yes"}]},"routing":"If Yes -> record named users in Module 2","considerations":"'Upload up to 1,000 files at a time' is user-level only and cannot be granted to a group."},{"ref":"M1.07","tier":"modules","group":"M1","section":"M1 Ingestion","question":"Is ingestion via email attachment required?","why":"Email ingestion is US-only and unavailable on FedRAMP/GovRAMP accounts.","atype":"Yes / No","options":["Yes","No"],"guidance":"","triggerText":"M1.01 = Yes AND G1.07 = No","showIf":{"all":[{"ref":"M1.01","op":"eq","value":"Yes"},{"ref":"G1.07","op":"eq","value":"No"}]},"routing":"If Yes -> ask M1.08","considerations":"Email ingestion is U.S. only, max 5 attachments without bulk permission, ~25 MB provider cap."},{"ref":"M1.08","tier":"modules","group":"M1","section":"M1 Ingestion","question":"Which mailboxes or senders will forward agreements, and who owns that process?","why":"Email intake needs an owner or it silently degrades.","atype":"Free text","options":[],"guidance":"","triggerText":"M1.07 = Yes","showIf":{"all":[{"ref":"M1.07","op":"eq","value":"Yes"}]},"routing":"","considerations":""},{"ref":"M1.09","tier":"modules","group":"M1","section":"M1 Ingestion","question":"Is import from cloud storage required?","why":"Requires an administrator to install the relevant connector from App Center first.","atype":"Multi select","options":["Box","Dropbox","Google Drive","OneDrive","SharePoint","None"],"guidance":"","triggerText":"M1.01 = Yes","showIf":{"all":[{"ref":"M1.01","op":"eq","value":"Yes"}]},"routing":"If any selected -> admin must install from App Center before go-live","considerations":"Connector must be installed by an administrator before users can import."},{"ref":"M1.10","tier":"modules","group":"M1","section":"M1 Ingestion","question":"What file formats are present in the estate?","why":"Unsupported formats will need conversion before upload.","atype":"Multi select","options":["PDF","Word","Excel","PowerPoint","HTML","Images (JPG/PNG/TIF)","Other"],"guidance":"","triggerText":"M1.01 = Yes","showIf":{"all":[{"ref":"M1.01","op":"eq","value":"Yes"}]},"routing":"If 'Other' -> confirm conversion approach","considerations":"Supported: Word, Excel, HTML, images (JPG/PDF/PNG/TIF/TIFF), PowerPoint."},{"ref":"M1.11","tier":"modules","group":"M1","section":"M1 Ingestion","question":"Are any documents larger than 190 MB, or with filenames over 255 characters?","why":"Both are hard limits that cause silent upload failures.","atype":"Yes / No","options":["Yes","No","Unsure"],"guidance":"","triggerText":"M1.01 = Yes","showIf":{"all":[{"ref":"M1.01","op":"eq","value":"Yes"}]},"routing":"If Yes or Unsure -> run a file audit before migration","considerations":"190 MB file-size limit; 255-character filename limit."},{"ref":"M1.12","tier":"modules","group":"M1","section":"M1 Ingestion","question":"Is duplicate document detection required, and is it currently enabled?","why":"Behaviour differs by customer segment; eSignature-only accounts have it off by default.","atype":"Yes / No","options":["Yes","No","Unsure"],"guidance":"","triggerText":"M1.01 = Yes","showIf":{"all":[{"ref":"M1.01","op":"eq","value":"Yes"}]},"routing":"If eSignature-only account -> must be enabled on request","considerations":"English-only. Detects exact hash matches only. Skipped files auto-delete after 45 days."},{"ref":"M1.13","tier":"modules","group":"M1","section":"M1 Ingestion","question":"Who will monitor upload and processing jobs, and how often?","why":"Failed jobs are invisible unless someone checks the monitoring hub.","atype":"Free text","options":[],"guidance":"","triggerText":"M1.01 = Yes","showIf":{"all":[{"ref":"M1.01","op":"eq","value":"Yes"}]},"routing":"","considerations":""},{"ref":"M2.01","tier":"modules","group":"M2","section":"M2 Permissions","question":"Does this module apply? Confirm an access model needs to be designed or reviewed.","why":"Module gate.","atype":"Yes / No","options":["Yes","No"],"guidance":"","triggerText":"Always ask","showIf":null,"routing":"If No -> skip to Module 3","considerations":""},{"ref":"M2.02","tier":"modules","group":"M2","section":"M2 Permissions","question":"Should any users have read-only visibility of all agreements?","why":"Maps to the 'View all agreements' permission.","atype":"Yes / No","options":["Yes","No"],"guidance":"","triggerText":"M2.01 = Yes","showIf":{"all":[{"ref":"M2.01","op":"eq","value":"Yes"}]},"routing":"If Yes -> capture named users or groups","considerations":"'View all agreements' cannot perform data review, or manage types, fields, sets or obligations."},{"ref":"M2.03","tier":"modules","group":"M2","section":"M2 Permissions","question":"Who needs full management rights across the repository?","why":"Maps to 'Organize and manage all agreements' - the highest access level.","atype":"Free text","options":[],"guidance":"","triggerText":"M2.01 = Yes","showIf":{"all":[{"ref":"M2.01","op":"eq","value":"Yes"}]},"routing":"","considerations":"Required for data review, obligations, custom types/fields, sets, hierarchies and party merging."},{"ref":"M2.04","tier":"modules","group":"M2","section":"M2 Permissions","question":"Will access be granted to individual users, to groups, or both?","why":"Bulk upload permission cannot be granted at group level.","atype":"Single select","options":["Users only","Groups only","Both"],"guidance":"","triggerText":"M2.01 = Yes","showIf":{"all":[{"ref":"M2.01","op":"eq","value":"Yes"}]},"routing":"If bulk upload needed -> must be granted per user","considerations":"The 'Everyone' group is a no-op for Agreement Manager access."},{"ref":"M2.05","tier":"modules","group":"M2","section":"M2 Permissions","question":"Should administrators be able to view agreement content, or only administer the system?","why":"Administrators do not get agreement visibility by default; this is a frequent misunderstanding.","atype":"Single select","options":["Administer only","Administer and view content"],"guidance":"","triggerText":"M2.01 = Yes","showIf":{"all":[{"ref":"M2.01","op":"eq","value":"Yes"}]},"routing":"","considerations":"Admins need explicit agreement-level permission; the admin role alone does not grant visibility."},{"ref":"M2.06","tier":"modules","group":"M2","section":"M2 Permissions","question":"Are there agreements that must be restricted to a named subset of users (e.g. HR, M&A, board)?","why":"Restricted content usually forces a set-based access design.","atype":"Yes / No","options":["Yes","No"],"guidance":"","triggerText":"M2.01 = Yes","showIf":{"all":[{"ref":"M2.01","op":"eq","value":"Yes"}]},"routing":"If Yes -> complete Module 5 (Sets) as mandatory, not optional","considerations":"There is no way to hide agreements from a user who has 'View all agreements'."},{"ref":"M2.07","tier":"modules","group":"M2","section":"M2 Permissions","question":"Do any users need to view agreements but be prevented from downloading them?","why":"This is not supported and often needs to be handled as a policy control.","atype":"Yes / No","options":["Yes","No"],"guidance":"","triggerText":"M2.01 = Yes","showIf":{"all":[{"ref":"M2.01","op":"eq","value":"Yes"}]},"routing":"If Yes -> flag as unsupported and agree a mitigation","considerations":"Download cannot be restricted for users with view access."},{"ref":"M2.08","tier":"modules","group":"M2","section":"M2 Permissions","question":"What is the joiner/mover/leaver process for agreement access?","why":"Access drift is the most common audit finding post-deployment.","atype":"Free text","options":[],"guidance":"","triggerText":"M2.01 = Yes","showIf":{"all":[{"ref":"M2.01","op":"eq","value":"Yes"}]},"routing":"","considerations":""},{"ref":"M2.09","tier":"modules","group":"M2","section":"M2 Audit","question":"Is an audit trail of who viewed or changed agreements required?","why":"Determines whether account-level activity logging needs to be part of the operating model.","atype":"Yes / No","options":["Yes","No"],"guidance":"","triggerText":"M2.01 = Yes","showIf":{"all":[{"ref":"M2.01","op":"eq","value":"Yes"}]},"routing":"If Yes -> ask M2.10 and M2.11","considerations":"Account-level activity log requires 'Organize and manage all agreements'."},{"ref":"M2.10","tier":"modules","group":"M2","section":"M2 Audit","question":"How long must audit evidence be retained, and does it need to be exported?","why":"Export caps mean long retention needs a scheduled extract process.","atype":"Free text","options":[],"guidance":"","triggerText":"M2.09 = Yes","showIf":{"all":[{"ref":"M2.09","op":"eq","value":"Yes"}]},"routing":"","considerations":"Activity log displays 200 events; CSV export capped at 5,000 rows; events can take 15 minutes to appear."},{"ref":"M2.11","tier":"modules","group":"M2","section":"M2 Audit","question":"Who will review permission changes, and how frequently?","why":"Admin audit logs are per account and need a named reviewer.","atype":"Free text","options":[],"guidance":"","triggerText":"M2.09 = Yes","showIf":{"all":[{"ref":"M2.09","op":"eq","value":"Yes"}]},"routing":"","considerations":"Audit logs export up to 1,000 records at a time; captured at account, not organisation, level."},{"ref":"M3.01","tier":"modules","group":"M3","section":"M3 Types & Fields","question":"Does this module apply? Confirm agreement types and fields need configuring.","why":"Module gate.","atype":"Yes / No","options":["Yes","No"],"guidance":"","triggerText":"Always ask","showIf":null,"routing":"If No -> skip to Module 4","considerations":""},{"ref":"M3.02","tier":"modules","group":"M3","section":"M3 Types & Fields","question":"What agreement types exist in the estate, and which matter most?","why":"Standard types come pre-populated; anything else needs custom configuration.","atype":"Free text","options":[],"guidance":"","triggerText":"M3.01 = Yes","showIf":{"all":[{"ref":"M3.01","op":"eq","value":"Yes"}]},"routing":"Compare against the standard type list before designing custom types","considerations":"Unrecognised documents are classified as 'Miscellaneous'."},{"ref":"M3.03","tier":"modules","group":"M3","section":"M3 Types & Fields","question":"Are custom agreement types required beyond the Docusign standard set?","why":"Custom types are capped and, once created, deletion is irreversible.","atype":"Yes / No","options":["Yes","No","Unsure"],"guidance":"","triggerText":"M3.01 = Yes","showIf":{"all":[{"ref":"M3.01","op":"eq","value":"Yes"}]},"routing":"If Yes -> ask M3.04 and M3.05","considerations":"200 custom agreement types per account. Custom types can be deleted but not recovered."},{"ref":"M3.04","tier":"modules","group":"M3","section":"M3 Types & Fields","question":"How many custom types are anticipated, and who approves new ones?","why":"Governance prevents type sprawl, which degrades reporting quality.","atype":"Free text","options":[],"guidance":"","triggerText":"M3.03 = Yes","showIf":{"all":[{"ref":"M3.03","op":"eq","value":"Yes"}]},"routing":"","considerations":"AI detection for custom types counts against the extraction limit."},{"ref":"M3.05","tier":"modules","group":"M3","section":"M3 Types & Fields","question":"Should AI detection be enabled for custom types, or will they be assigned manually?","why":"AI detection consumes limited extraction capacity.","atype":"Single select","options":["AI detection","Manual assignment","Mix"],"guidance":"","triggerText":"M3.03 = Yes","showIf":{"all":[{"ref":"M3.03","op":"eq","value":"Yes"}]},"routing":"","considerations":"Pro/Enterprise/Sales: 50 combined with AI detection, 15 custom agreement types max. Without AI detection: 100 total."},{"ref":"M3.06","tier":"modules","group":"M3","section":"M3 Types & Fields","question":"What data points must be captured that are not in the standard extracted-insights set?","why":"Defines the custom field requirement.","atype":"Free text","options":[],"guidance":"","triggerText":"M3.01 = Yes","showIf":{"all":[{"ref":"M3.01","op":"eq","value":"Yes"}]},"routing":"Cross-check against the Extracted Insights dictionary first","considerations":"100 fields per agreement type. Custom fields cannot be deleted once created."},{"ref":"M3.07","tier":"modules","group":"M3","section":"M3 Types & Fields","question":"Which fields are mandatory for reporting, and which are nice-to-have?","why":"Prioritises the data review effort where it actually affects outcomes.","atype":"Free text","options":[],"guidance":"","triggerText":"M3.01 = Yes","showIf":{"all":[{"ref":"M3.01","op":"eq","value":"Yes"}]},"routing":"","considerations":""},{"ref":"M3.08","tier":"modules","group":"M3","section":"M3 Types & Fields","question":"Are any required values constrained to a fixed picklist (e.g. payment terms, renewal types)?","why":"Several standard dropdowns only extract pre-set values; anything else becomes 'Other'.","atype":"Yes / No","options":["Yes","No"],"guidance":"","triggerText":"M3.01 = Yes","showIf":{"all":[{"ref":"M3.01","op":"eq","value":"Yes"}]},"routing":"If Yes -> validate against the supported value sets","considerations":"Payment Term, Renewal Type, NDA Type, Party Role, Assignment, Employment Type and Late Fees Apply only extract pre-set values."},{"ref":"M3.09","tier":"modules","group":"M3","section":"M3 Types & Fields","question":"Are non-agreement documents (policies, certificates, forms, invoices) in scope?","why":"Several non-agreement types are not surfaced during processing.","atype":"Yes / No","options":["Yes","No"],"guidance":"","triggerText":"M3.01 = Yes","showIf":{"all":[{"ref":"M3.01","op":"eq","value":"Yes"}]},"routing":"","considerations":"Certificate, Handbook, Notice and Policy are NOT surfaced during processing."},{"ref":"M4.01","tier":"modules","group":"M4","section":"M4 Data Review","question":"Does this module apply? Confirm AI-surfaced data will be validated.","why":"Module gate. Data review is required for trustworthy reporting.","atype":"Yes / No","options":["Yes","No"],"guidance":"","triggerText":"Always ask","showIf":null,"routing":"If No -> flag reporting accuracy risk in Considerations","considerations":""},{"ref":"M4.02","tier":"modules","group":"M4","section":"M4 Data Review","question":"Who is accountable for validating AI-suggested values, and at what volume per week?","why":"This is the largest recurring operational cost of the platform.","atype":"Free text","options":[],"guidance":"","triggerText":"M4.01 = Yes","showIf":{"all":[{"ref":"M4.01","op":"eq","value":"Yes"}]},"routing":"","considerations":"Requires 'Organize and manage all agreements'."},{"ref":"M4.03","tier":"modules","group":"M4","section":"M4 Data Review","question":"Will the whole back catalogue be reviewed, or only agreements above a materiality threshold?","why":"Full-catalogue review is rarely feasible; a threshold needs agreeing.","atype":"Single select","options":["All agreements","Above a value threshold","Active only","Specific types only"],"guidance":"","triggerText":"M4.01 = Yes","showIf":{"all":[{"ref":"M4.01","op":"eq","value":"Yes"}]},"routing":"","considerations":""},{"ref":"M4.04","tier":"modules","group":"M4","section":"M4 Data Review","question":"Is a target accuracy or completeness level defined for key fields?","why":"Gives a measurable definition of 'done' for the review effort.","atype":"Free text","options":[],"guidance":"","triggerText":"M4.01 = Yes","showIf":{"all":[{"ref":"M4.01","op":"eq","value":"Yes"}]},"routing":"","considerations":""},{"ref":"M4.05","tier":"modules","group":"M4","section":"M4 Data Review","question":"Should agreement details be captured at eSignature time to reduce downstream review?","why":"Fields set on the envelope flow straight through and avoid review entirely.","atype":"Yes / No","options":["Yes","No","Unsure"],"guidance":"","triggerText":"M4.01 = Yes","showIf":{"all":[{"ref":"M4.01","op":"eq","value":"Yes"}]},"routing":"If Yes -> engage the eSignature template owner","considerations":"Available on envelopes/templates: Automatic Renewal, Contract Value, Effective Date, Expiration Date, Renewal Notice Period, Renewal Term."},{"ref":"M4.06","tier":"modules","group":"M4","section":"M4 Data Review","question":"Is bulk correction of metadata expected as part of the deployment?","why":"Bulk metadata editing overwrites AI values permanently.","atype":"Yes / No","options":["Yes","No"],"guidance":"","triggerText":"M4.01 = Yes","showIf":{"all":[{"ref":"M4.01","op":"eq","value":"Yes"}]},"routing":"If Yes -> complete Module 12 (Migration & Bulk Data)","considerations":"Up to 10,000 agreements per job. Values become 'user-confirmed' and are excluded from future reprocessing."},{"ref":"M4.07","tier":"modules","group":"M4","section":"M4 Data Review","question":"How should the organisation handle reprocessing when new AI models are released?","why":"Reprocessing is opt-in and cannot be cancelled once started.","atype":"Single select","options":["Reprocess all","Reprocess selected","Do not reprocess","Undecided"],"guidance":"","triggerText":"M4.01 = Yes","showIf":{"all":[{"ref":"M4.01","op":"eq","value":"Yes"}]},"routing":"","considerations":"Reprocessing runs in the background and cannot be cancelled. User-entered values are never overwritten."},{"ref":"M5.01","tier":"modules","group":"M5","section":"M5 Sets","question":"Does this module apply? Confirm agreement sets are needed for organisation or access control.","why":"Module gate.","atype":"Yes / No","options":["Yes","No"],"guidance":"","triggerText":"Always ask","showIf":null,"routing":"If M2.06 = Yes this module is mandatory","considerations":""},{"ref":"M5.02","tier":"modules","group":"M5","section":"M5 Sets","question":"Will sets be used primarily for organisation, for access control, or both?","why":"Access-control sets need far tighter governance than organisational ones.","atype":"Single select","options":["Organisation","Access control","Both"],"guidance":"","triggerText":"M5.01 = Yes","showIf":{"all":[{"ref":"M5.01","op":"eq","value":"Yes"}]},"routing":"","considerations":""},{"ref":"M5.03","tier":"modules","group":"M5","section":"M5 Sets","question":"How many sets are anticipated, and who owns their creation?","why":"There is a hard ceiling of 1,000 sets per account.","atype":"Free text","options":[],"guidance":"","triggerText":"M5.01 = Yes","showIf":{"all":[{"ref":"M5.01","op":"eq","value":"Yes"}]},"routing":"","considerations":"1,000 agreement sets per account. Creating sets requires 'Organize and manage all agreements'."},{"ref":"M5.04","tier":"modules","group":"M5","section":"M5 Sets","question":"Should sets populate automatically using smart filters, or be curated manually?","why":"Smart filters have specific logical limitations.","atype":"Single select","options":["Smart filters","Manual","Both"],"guidance":"","triggerText":"M5.01 = Yes","showIf":{"all":[{"ref":"M5.01","op":"eq","value":"Yes"}]},"routing":"If smart filters -> validate the filter logic is expressible","considerations":"Smart filters use AND across different fields, OR within the same field. Rolling date and duration-based filters are NOT supported."},{"ref":"M5.05","tier":"modules","group":"M5","section":"M5 Sets","question":"Do any required set rules depend on rolling dates (e.g. 'expiring in the next 90 days')?","why":"This is explicitly unsupported and needs an alternative design.","atype":"Yes / No","options":["Yes","No"],"guidance":"","triggerText":"M5.04 includes Smart filters","showIf":{"any":[{"ref":"M5.04","op":"containsAny","value":["Smart filters","Both"]}]},"routing":"If Yes -> redesign using dashboards or saved searches instead","considerations":"Smart filters do not support rolling date or duration-based conditions."},{"ref":"M5.06","tier":"modules","group":"M5","section":"M5 Sets","question":"Who should hold Set Manager, Set Collaborator and Set Viewer roles?","why":"Defines the set-level access model.","atype":"Free text","options":[],"guidance":"","triggerText":"M5.01 = Yes","showIf":{"all":[{"ref":"M5.01","op":"eq","value":"Yes"}]},"routing":"","considerations":""},{"ref":"M6.01","tier":"modules","group":"M6","section":"M6 Parties","question":"Does this module apply? Confirm party data quality is in scope.","why":"Module gate.","atype":"Yes / No","options":["Yes","No"],"guidance":"","triggerText":"Always ask","showIf":null,"routing":"If No -> skip to Module 7","considerations":""},{"ref":"M6.02","tier":"modules","group":"M6","section":"M6 Parties","question":"Is there a known duplicate party problem (same counterparty under multiple names)?","why":"Duplicate parties break party-level reporting and the Party Hub.","atype":"Yes / No","options":["Yes","No","Unsure"],"guidance":"","triggerText":"M6.01 = Yes","showIf":{"all":[{"ref":"M6.01","op":"eq","value":"Yes"}]},"routing":"If Yes -> ask M6.03","considerations":"Standardisation handles case, whitespace, punctuation and legal descriptors. Inc. vs LLC remain distinct."},{"ref":"M6.03","tier":"modules","group":"M6","section":"M6 Parties","question":"Should the one-time party clean-up be run, and is the organisation aware it is irreversible?","why":"Clean-up cannot be paused, reverted or unmerged.","atype":"Yes / No","options":["Yes","No","Undecided"],"guidance":"","triggerText":"M6.02 = Yes","showIf":{"all":[{"ref":"M6.02","op":"eq","value":"Yes"}]},"routing":"If Yes -> obtain written sign-off before running","considerations":"IRREVERSIBLE. English-language documents only. Consolidated party takes the name of the oldest record."},{"ref":"M6.04","tier":"modules","group":"M6","section":"M6 Parties","question":"Is there a master vendor or customer list that party names should reconcile to?","why":"Determines whether party naming needs to align to an external system of record.","atype":"Yes / No","options":["Yes","No"],"guidance":"","triggerText":"M6.01 = Yes","showIf":{"all":[{"ref":"M6.01","op":"eq","value":"Yes"}]},"routing":"If Yes -> request the list and plan a reconciliation pass","considerations":""},{"ref":"M6.05","tier":"modules","group":"M6","section":"M6 Parties","question":"Do parties need to be classified as internal versus external?","why":"Party Side drives filtering and several dashboard views.","atype":"Yes / No","options":["Yes","No"],"guidance":"","triggerText":"M6.01 = Yes","showIf":{"all":[{"ref":"M6.01","op":"eq","value":"Yes"}]},"routing":"","considerations":""},{"ref":"M6.06","tier":"modules","group":"M6","section":"M6 Parties","question":"Are agreement hierarchies (master agreements with dependent SOWs, amendments) required?","why":"Hierarchies need Can Edit on the underlying agreements and are managed from the Party Hub.","atype":"Yes / No","options":["Yes","No"],"guidance":"","triggerText":"M6.01 = Yes","showIf":{"all":[{"ref":"M6.01","op":"eq","value":"Yes"}]},"routing":"If Yes -> confirm who holds Can Edit rights","considerations":"Creating hierarchies requires 'Organize and manage all agreements'."},{"ref":"M7.01","tier":"modules","group":"M7","section":"M7 Obligations","question":"Does this module apply? Confirm obligation tracking is in scope.","why":"Module gate. Obligation Management is a separate plan item.","atype":"Yes / No","options":["Yes","No"],"guidance":"","triggerText":"Always ask","showIf":null,"routing":"If No -> skip to Module 8","considerations":"Requires the Obligation Management plan item."},{"ref":"M7.02","tier":"modules","group":"M7","section":"M7 Obligations","question":"Which obligation types must be tracked?","why":"Only a subset is AI-surfaced; the rest require manual creation.","atype":"Multi select","options":["Payment","Renewal notice","Termination notice","Compliance","Confidentiality","SLA","Warranty","Data breach","Other"],"guidance":"","triggerText":"M7.01 = Yes","showIf":{"all":[{"ref":"M7.01","op":"eq","value":"Yes"}]},"routing":"","considerations":"AI surfaces Payment, Renewal Notice and Termination only - and only for English (U.S.) agreements."},{"ref":"M7.03","tier":"modules","group":"M7","section":"M7 Obligations","question":"Are the in-scope agreements in English (U.S.)?","why":"Obligations AI runs on a U.S. server and does not support other languages.","atype":"Yes / No","options":["Yes","No","Mixed"],"guidance":"","triggerText":"M7.01 = Yes","showIf":{"all":[{"ref":"M7.01","op":"eq","value":"Yes"}]},"routing":"If No or Mixed -> obligations must be created manually for those agreements","considerations":"Obligations are AI-surfaced for English (U.S.) only. Dashboards will under-report for other languages."},{"ref":"M7.04","tier":"modules","group":"M7","section":"M7 Obligations","question":"Who is accountable for creating and closing manual obligations?","why":"Manual obligations decay without a named owner.","atype":"Free text","options":[],"guidance":"","triggerText":"M7.01 = Yes","showIf":{"all":[{"ref":"M7.01","op":"eq","value":"Yes"}]},"routing":"","considerations":""},{"ref":"M7.05","tier":"modules","group":"M7","section":"M7 Obligations","question":"What notification lead times are required before an obligation falls due?","why":"Drives subscription and notification configuration.","atype":"Free text","options":[],"guidance":"","triggerText":"M7.01 = Yes","showIf":{"all":[{"ref":"M7.01","op":"eq","value":"Yes"}]},"routing":"","considerations":""},{"ref":"M8.01","tier":"modules","group":"M8","section":"M8 Renewals","question":"Does this module apply? Confirm renewal management is in scope.","why":"Module gate.","atype":"Yes / No","options":["Yes","No"],"guidance":"","triggerText":"Always ask","showIf":null,"routing":"If B2.03 = Yes this module is high priority","considerations":""},{"ref":"M8.02","tier":"modules","group":"M8","section":"M8 Renewals","question":"Which teams need renewal visibility, and at what lead time?","why":"Different functions need different horizons (procurement vs sales vs legal).","atype":"Free text","options":[],"guidance":"","triggerText":"M8.01 = Yes","showIf":{"all":[{"ref":"M8.01","op":"eq","value":"Yes"}]},"routing":"","considerations":""},{"ref":"M8.03","tier":"modules","group":"M8","section":"M8 Renewals","question":"Are Expiration Date, Renewal Type and Renewal Term reliably populated today?","why":"Auto-extension silently fails without all three.","atype":"Single select","options":["Yes","Partially","No","Unsure"],"guidance":"","triggerText":"M8.01 = Yes","showIf":{"all":[{"ref":"M8.01","op":"eq","value":"Yes"}]},"routing":"If not 'Yes' -> prioritise these fields in Module 4 data review","considerations":"Auto-extension requires accurate Expiration Date, Renewal Type and Renewal Term. No term value means the date is not extended."},{"ref":"M8.04","tier":"modules","group":"M8","section":"M8 Renewals","question":"Are there evergreen or auto-renewing agreements that need active monitoring?","why":"These are the highest-risk agreements in most estates.","atype":"Yes / No","options":["Yes","No","Unsure"],"guidance":"","triggerText":"M8.01 = Yes","showIf":{"all":[{"ref":"M8.01","op":"eq","value":"Yes"}]},"routing":"","considerations":""},{"ref":"M8.05","tier":"modules","group":"M8","section":"M8 Renewals","question":"Should renewal notifications be routed to individuals, or to a shared queue?","why":"Determines subscription design and resilience to staff turnover.","atype":"Single select","options":["Individuals","Shared queue","Both"],"guidance":"","triggerText":"M8.01 = Yes","showIf":{"all":[{"ref":"M8.01","op":"eq","value":"Yes"}]},"routing":"","considerations":"Notification preferences are all enabled by default and can be customised per type."},{"ref":"M9.01","tier":"modules","group":"M9","section":"M9 Reporting","question":"Does this module apply? Confirm dashboards and reporting are in scope.","why":"Module gate.","atype":"Yes / No","options":["Yes","No"],"guidance":"","triggerText":"Always ask","showIf":null,"routing":"If No -> skip to Module 10","considerations":""},{"ref":"M9.02","tier":"modules","group":"M9","section":"M9 Reporting","question":"Which standard dashboards will be used, and by whom?","why":"Standard dashboards often cover more than expected, reducing custom build.","atype":"Multi select","options":["My dashboard","Administrator","Agreements","Obligations","Renewals","Requests"],"guidance":"","triggerText":"M9.01 = Yes","showIf":{"all":[{"ref":"M9.01","op":"eq","value":"Yes"}]},"routing":"","considerations":"The Obligations dashboard is English (U.S.) AI only."},{"ref":"M9.03","tier":"modules","group":"M9","section":"M9 Reporting","question":"Are custom dashboards or reports required?","why":"Custom builds are capped and need an owner.","atype":"Yes / No","options":["Yes","No"],"guidance":"","triggerText":"M9.01 = Yes","showIf":{"all":[{"ref":"M9.01","op":"eq","value":"Yes"}]},"routing":"If Yes -> ask M9.04","considerations":"Up to 100 custom dashboards, 10 widgets each."},{"ref":"M9.04","tier":"modules","group":"M9","section":"M9 Reporting","question":"What specific reports are required, and what fields do they depend on?","why":"Report requirements drive the field configuration in Module 3.","atype":"Free text","options":[],"guidance":"","triggerText":"M9.03 = Yes","showIf":{"all":[{"ref":"M9.03","op":"eq","value":"Yes"}]},"routing":"Cross-check every dependent field is supported for the relevant languages","considerations":"Top Liabilities, Late Fee Clauses, Assignment Controls and Payment Terms reports are English/French/German only."},{"ref":"M9.05","tier":"modules","group":"M9","section":"M9 Reporting","question":"Does any report need to cover more than 25,000 agreements in a single export?","why":"Hard export ceiling.","atype":"Yes / No","options":["Yes","No","Unsure"],"guidance":"","triggerText":"M9.01 = Yes","showIf":{"all":[{"ref":"M9.01","op":"eq","value":"Yes"}]},"routing":"If Yes -> design a segmented export approach","considerations":"CSV report export capped at 25,000 agreements."},{"ref":"M9.06","tier":"modules","group":"M9","section":"M9 Reporting","question":"Who needs scheduled report delivery, and at what frequency?","why":"Drives subscription configuration.","atype":"Free text","options":[],"guidance":"","triggerText":"M9.01 = Yes","showIf":{"all":[{"ref":"M9.01","op":"eq","value":"Yes"}]},"routing":"","considerations":"Sharing controls who can open a report; subscriptions control who receives it by email."},{"ref":"M9.07","tier":"modules","group":"M9","section":"M9 Reporting","question":"Does agreement data need to feed an external BI tool or data warehouse?","why":"Determines whether API or export-based integration is needed.","atype":"Yes / No","options":["Yes","No"],"guidance":"","triggerText":"M9.01 = Yes","showIf":{"all":[{"ref":"M9.01","op":"eq","value":"Yes"}]},"routing":"If Yes -> complete Module 11 (Integrations)","considerations":""},{"ref":"M10.01","tier":"modules","group":"M10","section":"M10 Automation","question":"Does this module apply? Confirm Conditional Rules automation is in scope.","why":"Module gate.","atype":"Yes / No","options":["Yes","No"],"guidance":"","triggerText":"Always ask","showIf":null,"routing":"If No -> skip to Module 11","considerations":""},{"ref":"M10.02","tier":"modules","group":"M10","section":"M10 Automation","question":"What repetitive metadata corrections or standardisations happen today?","why":"These are the best candidates for the first rules.","atype":"Free text","options":[],"guidance":"","triggerText":"M10.01 = Yes","showIf":{"all":[{"ref":"M10.01","op":"eq","value":"Yes"}]},"routing":"","considerations":"Maximum 5 rules per account, each with up to 5 conditions."},{"ref":"M10.03","tier":"modules","group":"M10","section":"M10 Automation","question":"Should any downstream action be triggered automatically (e.g. raising a renewal request)?","why":"Rules can trigger Agreement Desk requests via Workflow Builder.","atype":"Yes / No","options":["Yes","No"],"guidance":"","triggerText":"M10.01 = Yes","showIf":{"all":[{"ref":"M10.01","op":"eq","value":"Yes"}]},"routing":"If Yes -> confirm Agreement Desk is licensed and configured","considerations":"Rules trigger Workflow Builder; complex routing belongs in Workflow Builder, not rules."},{"ref":"M10.04","tier":"modules","group":"M10","section":"M10 Automation","question":"Are the in-scope agreements in English?","why":"Conditional Rules are English-only at launch.","atype":"Yes / No","options":["Yes","No","Mixed"],"guidance":"","triggerText":"M10.01 = Yes","showIf":{"all":[{"ref":"M10.01","op":"eq","value":"Yes"}]},"routing":"If No -> rules are unavailable for those agreements","considerations":"Conditional Rules support English agreements only at launch."},{"ref":"M10.05","tier":"modules","group":"M10","section":"M10 Automation","question":"Who approves and governs rule changes?","why":"Rules silently rewrite data at scale and need change control.","atype":"Free text","options":[],"guidance":"","triggerText":"M10.01 = Yes","showIf":{"all":[{"ref":"M10.01","op":"eq","value":"Yes"}]},"routing":"","considerations":"A target field can only be updated by one rule. Each rule can reprocess up to 20,000 agreements."},{"ref":"M11.01","tier":"modules","group":"M11","section":"M11 Integrations","question":"Does this module apply? Confirm integration with other systems is in scope.","why":"Module gate.","atype":"Yes / No","options":["Yes","No"],"guidance":"","triggerText":"Always ask","showIf":null,"routing":"If No -> skip to Module 12","considerations":""},{"ref":"M11.02","tier":"modules","group":"M11","section":"M11 Integrations","question":"Which systems must exchange data with Agreement Manager?","why":"Defines the integration surface.","atype":"Multi select","options":["Salesforce","SAP","Workday","NetSuite","ServiceNow","BI tool","Data warehouse","Other","None"],"guidance":"","triggerText":"M11.01 = Yes","showIf":{"all":[{"ref":"M11.01","op":"eq","value":"Yes"}]},"routing":"","considerations":""},{"ref":"M11.03","tier":"modules","group":"M11","section":"M11 Integrations","question":"If Docusign CLM is in use, what is the expected division of responsibility between CLM and Agreement Manager?","why":"Overlap between the two causes duplicated effort and conflicting data.","atype":"Free text","options":[],"guidance":"","triggerText":"G1.14 = In use today OR Planned","showIf":{"any":[{"ref":"G1.14","op":"eq","value":"In use today"},{"ref":"G1.14","op":"eq","value":"Planned"}]},"routing":"","considerations":"CLM attributes are read-only in Agreement Manager; edits must be made in CLM. Requires IAM Enterprise with CLM-IAM integration."},{"ref":"M11.04","tier":"modules","group":"M11","section":"M11 Integrations","question":"Is CLM-to-Agreement Manager document sync expected, and by when?","why":"Compatibility timelines have historically shifted.","atype":"Free text","options":[],"guidance":"","triggerText":"G1.14 = In use today OR Planned","showIf":{"any":[{"ref":"G1.14","op":"eq","value":"In use today"},{"ref":"G1.14","op":"eq","value":"Planned"}]},"routing":"","considerations":"CLM compatibility documented as expected early 2026 - validate current status with Docusign."},{"ref":"M11.05","tier":"modules","group":"M11","section":"M11 Integrations","question":"Is API access required, and does the team have development capacity?","why":"Determines whether integration is configuration or build.","atype":"Yes / No","options":["Yes","No","Unsure"],"guidance":"","triggerText":"M11.01 = Yes","showIf":{"all":[{"ref":"M11.01","op":"eq","value":"Yes"}]},"routing":"","considerations":""},{"ref":"M12.01","tier":"modules","group":"M12","section":"M12 Migration","question":"Does this module apply? Confirm documents or metadata will be migrated from another system.","why":"Module gate.","atype":"Yes / No","options":["Yes","No"],"guidance":"","triggerText":"G1.15 = Yes OR M4.06 = Yes","showIf":{"any":[{"ref":"G1.15","op":"eq","value":"Yes"},{"ref":"M4.06","op":"eq","value":"Yes"}]},"routing":"If No -> skip to Module 13","considerations":""},{"ref":"M12.02","tier":"modules","group":"M12","section":"M12 Migration","question":"Where are the documents held today, and in what volume?","why":"Sizes the migration and identifies extraction effort.","atype":"Free text","options":[],"guidance":"","triggerText":"M12.01 = Yes","showIf":{"all":[{"ref":"M12.01","op":"eq","value":"Yes"}]},"routing":"","considerations":""},{"ref":"M12.03","tier":"modules","group":"M12","section":"M12 Migration","question":"Does existing metadata need to be preserved, or will AI re-derive it?","why":"Determines whether bulk metadata editing is required.","atype":"Single select","options":["Preserve exis
