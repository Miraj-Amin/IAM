<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Docusign IAM — Discovery Questionnaire</title>
<meta name="description" content="Conditional discovery questionnaire for Docusign IAM Agreement Manager.">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --purple:#241041;--purple-mid:#3B1F63;--purple-soft:#5B3E8E;
  --pale:#EDEBF5;--gold:#C9A227;--gold-soft:#F5EFD9;
  --ink:#2B2B33;--muted:#6E6A7A;--line:#E2DEEC;--bg:#F7F6FA;
  --ok:#2E7D32;--warn:#F57F17;--bad:#C62828;--blue:#1D5C8C;
  --admin:#8C1D40;--sidebar:288px;--radius:13px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--purple-soft)}

/* ── layout ── */
.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar);background:var(--purple);color:#fff;position:fixed;top:0;bottom:0;left:0;
  display:flex;flex-direction:column;z-index:40;transition:transform .22s ease}
.main{flex:1;margin-left:var(--sidebar);min-width:0;display:flex;flex-direction:column}

.brand{padding:20px 20px 16px;border-bottom:1px solid rgba(255,255,255,.12)}
.brand .eyebrow{font-size:10px;letter-spacing:.18em;color:var(--gold);font-weight:700}
.brand h1{font-size:17px;font-weight:700;margin-top:5px;line-height:1.3}
.brand .sub{font-size:11.5px;color:#BFB4D6;margin-top:4px}

.progress-wrap{padding:14px 20px;border-bottom:1px solid rgba(255,255,255,.12)}
.pbar{height:6px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s ease}
.pmeta{display:flex;justify-content:space-between;font-size:11.5px;color:#BFB4D6;margin-top:7px}

.nav{flex:1;overflow-y:auto;padding:10px 0 20px}
.nav-group{padding:13px 20px 5px;font-size:10px;letter-spacing:.14em;color:var(--gold);font-weight:700}
.nav a{display:flex;align-items:center;gap:9px;padding:8px 20px;color:#DDD6EC;text-decoration:none;
  font-size:13.5px;border-left:3px solid transparent;white-space:nowrap}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.active{background:rgba(201,162,39,.16);border-left-color:var(--gold);color:#fff;font-weight:600}
.nav a .cnt{margin-left:auto;font-size:11px;color:#A99BC4;font-variant-numeric:tabular-nums}
.nav a.done .cnt{color:var(--gold)}
.nav a.flagged::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--bad);flex-shrink:0}

.sidebar-footer{padding:14px 20px;border-top:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;gap:8px}
.sidebar-footer .user{font-size:12px;color:#BFB4D6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebar-footer .user b{display:block;color:#fff;font-size:13px}

/* ── topbar ── */
.topbar{position:sticky;top:0;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:11px 26px;display:flex;gap:11px;align-items:center;z-index:30;flex-wrap:wrap}
.search{flex:1;min-width:190px;position:relative}
.search input{width:100%;padding:9px 13px 9px 34px;border:1px solid var(--line);border-radius:9px;background:#fff}
.search input:focus{outline:2px solid var(--purple-soft);outline-offset:-1px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.45}
.btn{padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:13.5px;
  font-weight:600;color:var(--purple-mid);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--pale);border-color:var(--purple-soft)}
.btn.primary{background:var(--purple);color:#fff;border-color:var(--purple)}
.btn.primary:hover{background:var(--purple-mid)}
.btn.danger{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.danger:hover{filter:brightness(0.9)}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.save-status{font-size:12px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:5px}
.save-status .dot{width:7px;height:7px;border-radius:50%;background:var(--line)}
.save-status.saving .dot{background:var(--warn);animation:pulse .8s infinite}
.save-status.saved .dot{background:var(--ok)}
.save-status.error .dot{background:var(--bad)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.menuwrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);
  border-radius:11px;box-shadow:0 12px 34px rgba(36,16,65,.16);min-width:210px;padding:6px;display:none;z-index:60}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:7px;font-size:13.5px}
.menu button:hover{background:var(--pale)}
.menu .sep{height:1px;background:var(--line);margin:5px 0}
.hamburger{display:none}

/* ── content ── */
.content{padding:26px;max-width:1080px;width:100%}

/* ── LOGIN ── */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--purple) 0%,var(--purple-soft) 100%);padding:20px}
.login-box{background:#fff;border-radius:20px;padding:40px 38px;max-width:400px;width:100%;
  box-shadow:0 24px 60px rgba(36,16,65,.35)}
.login-box .eyebrow{font-size:10px;letter-spacing:.2em;color:var(--gold);font-weight:700}
.login-box h1{font-size:24px;color:var(--purple);margin:8px 0 6px;font-weight:700}
.login-box p{font-size:13.5px;color:var(--muted);margin-bottom:28px}
.form-field{margin-bottom:16px}
.form-field label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin-bottom:5px}
.form-field input{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;font-size:15px}
.form-field input:focus{outline:2px solid var(--purple-soft);outline-offset:-1px;border-color:var(--purple-soft)}
.login-err{background:#FDECEA;color:var(--bad);padding:10px 13px;border-radius:9px;font-size:13px;margin-bottom:14px;display:none}
.login-err.show{display:block}

/* ── SESSION LIST ── */
.page-head{margin-bottom:24px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px}
.page-head .titles .kicker{font-size:10.5px;letter-spacing:.15em;color:var(--gold);font-weight:700}
.page-head .titles h2{font-size:26px;color:var(--purple);margin-top:5px;font-weight:700}
.page-head .titles p{color:var(--muted);font-size:14px;margin-top:5px}
.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:20px;align-items:center}
.filters input{padding:9px 13px;border:1px solid var(--line);border-radius:9px;background:#fff;min-width:220px}
.filters select{padding:9px 13px;border:1px solid var(--line);border-radius:9px;background:#fff}
.sessions-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.sess-card{background:#fff;border:1.5px solid var(--line);border-radius:var(--radius);padding:20px;
  cursor:pointer;transition:box-shadow .15s,border-color .15s,transform .12s}
.sess-card:hover{box-shadow:0 6px 22px rgba(36,16,65,.1);border-color:var(--purple-soft);transform:translateY(-1px)}
.sess-card.complete{border-left:4px solid var(--ok)}
.sess-card.draft{border-left:4px solid var(--gold)}
.sess-card .sc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:12px}
.sess-card h3{font-size:16px;font-weight:700;color:var(--purple);line-height:1.3}
.status-pill{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;flex-shrink:0}
.status-pill.draft{background:var(--gold-soft);color:#7A6114}
.status-pill.complete{background:#E8F5E9;color:var(--ok)}
.sess-card .sc-meta{font-size:12.5px;color:var(--muted);margin-bottom:14px;display:flex;flex-direction:column;gap:3px}
.sess-card .sc-meta span{display:flex;align-items:center;gap:5px}
.sess-pbar{height:5px;border-radius:99px;background:var(--pale);overflow:hidden;margin-bottom:6px}
.sess-pbar i{display:block;height:100%;background:var(--gold)}
.sess-card .sc-foot{display:flex;justify-content:space-between;align-items:center}
.sess-card .sc-foot .pct{font-size:12px;font-weight:700;color:var(--purple-soft)}
.sess-card .sc-foot .flags{font-size:12px;color:var(--bad);display:flex;align-items:center;gap:4px}
.sc-actions{display:flex;gap:6px;opacity:0;transition:opacity .15s}
.sess-card:hover .sc-actions{opacity:1}
.sc-del{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:#fff;
  font-size:13px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.sc-del:hover{background:#FDECEA;border-color:var(--bad);color:var(--bad)}
.empty-state{text-align:center;padding:64px 20px;color:var(--muted);grid-column:1/-1}
.empty-state b{display:block;font-size:18px;color:var(--purple);margin-bottom:8px}
.empty-state p{font-size:14px;margin-bottom:22px}

/* ── head ── */
.head{margin-bottom:20px}
.head .kicker{font-size:10.5px;letter-spacing:.15em;color:var(--gold);font-weight:700}
.head h2{font-size:26px;color:var(--purple);margin-top:5px;font-weight:700}
.head p{color:var(--muted);margin-top:7px;max-width:70ch;font-size:14px}
.toolrow{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:16px 0 6px}
.chip{font-size:12px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--muted);font-weight:600}
.chip.on{background:var(--purple);color:#fff;border-color:var(--purple)}

/* ── question card ── */
.q{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:17px 19px;margin-bottom:13px;
  border-left:4px solid var(--line);transition:border-color .15s,box-shadow .15s}
.q:hover{box-shadow:0 3px 14px rgba(36,16,65,.07)}
.q.answered{border-left-color:var(--ok)}
.q.gated{opacity:.55}
.q-top{display:flex;gap:11px;align-items:flex-start}
.ref{font-size:11px;font-weight:700;color:var(--purple-soft);background:var(--pale);
  padding:3px 8px;border-radius:6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.qtext{font-weight:600;font-size:15.5px;flex:1;line-height:1.45}
.why{color:var(--muted);font-size:13px;margin:9px 0 0;padding-left:2px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:10.5px;padding:3px 8px;border-radius:5px;font-weight:700;letter-spacing:.03em}
.tag.type{background:#EEF3F8;color:var(--blue)}
.tag.trig{background:var(--pale);color:var(--purple-soft)}
.tag.route{background:var(--gold-soft);color:#7A6114}
.answer{margin-top:13px}
.lbl{font-size:10.5px;letter-spacing:.1em;font-weight:700;color:var(--muted);margin-bottom:6px;display:block}
.field{display:flex;gap:8px;align-items:flex-start}
select,textarea,input[type=text],input[type=number]{width:100%;padding:9px 11px;
  border:1px solid var(--line);border-radius:9px;background:#fff}
select:focus,textarea:focus,input:focus{outline:2px solid var(--purple-soft);outline-offset:-1px}
textarea{resize:vertical;min-height:64px}
.editopts{flex:0 0 auto;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;
  font-size:12.5px;font-weight:600;color:var(--purple-soft);white-space:nowrap}
.editopts:hover{background:var(--pale)}
.multi{display:flex;flex-wrap:wrap;gap:7px}
.opt{padding:7px 12px;border:1px solid var(--line);border-radius:99px;background:#fff;font-size:13px;font-weight:500}
.opt:hover{border-color:var(--purple-soft)}
.opt.sel{background:var(--purple);color:#fff;border-color:var(--purple)}
.notes{margin-top:10px}
.cons{margin-top:12px;background:#FDECEA;border-left:3px solid var(--bad);padding:9px 12px;
  border-radius:0 8px 8px 0;font-size:12.5px;color:#7A1F1A}
.cons b{color:var(--bad)}
.gatenote{margin-top:11px;background:var(--pale);border-left:3px solid var(--purple-soft);
  padding:9px 12px;border-radius:0 8px 8px 0;font-size:12.5px;color:var(--purple-mid)}

/* ── considerations ── */
.cons-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:17px 19px;
  margin-bottom:13px;border-left:4px solid var(--line)}
.cons-card.on{border-left-color:var(--bad);background:#FFFBFB}
.cons-card .status{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:99px;letter-spacing:.04em}
.status.on{background:var(--bad);color:#fff}
.status.off{background:#EFEDF4;color:var(--muted)}
.cons-card h4{font-size:15px;margin:9px 0 4px;color:var(--purple)}
.cons-card .act{margin-top:9px;background:var(--gold-soft);padding:9px 12px;border-radius:8px;
  font-size:13px;color:#6B5410}

/* ── dashboard ── */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:13px;margin-bottom:22px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:17px}
.card .n{font-size:31px;font-weight:700;color:var(--purple);line-height:1;font-variant-numeric:tabular-nums}
.card .l{font-size:12px;color:var(--muted);margin-top:6px;font-weight:600}
.card.alert .n{color:var(--bad)}
table.grid{width:100%;border-collapse:collapse;background:#fff;border-radius:var(--radius);
  overflow:hidden;border:1px solid var(--line)}
table.grid th{background:var(--purple);color:#fff;text-align:left;padding:11px 14px;font-size:12px;
  font-weight:700;letter-spacing:.03em}
table.grid td{padding:11px 14px;border-top:1px solid var(--line);font-size:13.5px}
table.grid tr:nth-child(even) td{background:#FBFAFD}
.mini{height:6px;border-radius:99px;background:var(--pale);overflow:hidden;min-width:80px}
.mini i{display:block;height:100%;background:var(--gold)}

/* ── modal ── */
.overlay{position:fixed;inset:0;background:rgba(36,16,65,.45);display:none;align-items:center;
  justify-content:center;z-index:100;padding:20px}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:15px;max-width:560px;width:100%;max-height:86vh;
  display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(36,16,65,.3)}
.modal header{padding:18px 22px;border-bottom:1px solid var(--line)}
.modal header h3{font-size:17px;color:var(--purple)}
.modal header p{font-size:12.5px;color:var(--muted);margin-top:4px}
.modal .bd{padding:18px 22px;overflow-y:auto}
.modal footer{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end}
.optrow{display:flex;gap:7px;align-items:center;margin-bottom:8px}
.optrow input{flex:1}
.iconbtn{padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px;line-height:1}
.iconbtn:hover{background:var(--pale)}
.iconbtn.del:hover{background:#FDECEA;border-color:var(--bad);color:var(--bad)}

.empty{text-align:center;padding:56px 20px;color:var(--muted)}
.empty b{display:block;color:var(--purple);font-size:16px;margin-bottom:6px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--purple);
  color:#fff;padding:11px 20px;border-radius:11px;font-size:13.5px;font-weight:600;z-index:200;
  transition:transform .25s ease;box-shadow:0 10px 28px rgba(36,16,65,.28)}
.toast.show{transform:translateX(-50%) translateY(0)}
.loading-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--purple);flex-direction:column;gap:16px}
.spinner{width:40px;height:40px;border:3px solid rgba(255,255,255,.2);border-top-color:var(--gold);
  border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-screen p{color:#BFB4D6;font-size:14px}

@media(max-width:900px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .hamburger{display:inline-flex}
  .content{padding:18px}
  .sessions-grid{grid-template-columns:1fr}
}
@media print{
  .sidebar,.topbar,.toolrow,.editopts,.sc-actions,.ifloat{display:none!important}
  .main{margin-left:0}
  .q{break-inside:avoid;box-shadow:none}
}
</style>
</head>
<body>

<div id="root">
  <div class="loading-screen"><div class="spinner"></div><p>Loading…</p></div>
</div>
<div class="toast" id="toast"></div>

<script src="./data.js"></script>
<script>
const SUPABASE_URL  = 'https://yotluxfbeauektddlqka.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlvdGx1eGZiZWF1ZWt0ZGRscWthIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1NjUxNDIsImV4cCI6MjEwMzE0MTE0Mn0.zfUtnhqWLeyty87RstGEDv7JbH79-GUUgVd5oJ-wbLA';

const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON);

let appState = 'loading';
let currentUser = null;
let currentSession = null;
let saveTimer = null;
let saveState = 'idle';

let S = { answers:{}, notes:{}, optionOverrides:{}, meta:{} };
let qView = 'interview', qSearch = '', showGated = false, onlyUnanswered = false;
let prevVisible = new Set();

const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg, dur=2400){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),dur);
}
function download(name,content,type){
  const b=new Blob([content],{type});const u=URL.createObjectURL(b);
  const a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);
}
function fmt(dt){if(!dt)return '';const d=new Date(dt);return d.toLocaleDateString('en-GB',
  {day:'numeric',month:'short',year:'numeric'});}
function timeAgo(dt){if(!dt)return '';const s=Math.floor((Date.now()-new Date(dt))/1000);
  if(s<60)return 'just now';if(s<3600)return Math.floor(s/60)+'m ago';
  if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago';}

const byRef={};DATA.questions.forEach(x=>byRef[x.ref]=x);
const optsFor=r=>S.optionOverrides[r]||byRef[r]?.options||[];
const ans=r=>S.answers[r];
const hasAns=r=>{const v=ans(r);return Array.isArray(v)?v.length>0:(v!==undefined&&v!==null&&String(v).trim()!=='');};
function testCond(c){
  const v=ans(c.ref);
  const arr=Array.isArray(v)?v:(v===undefined||v===null||v===''?[]:[String(v)]);
  switch(c.op){
    case 'answered': return arr.length>0;
    case 'eq': return arr.some(x=>String(x)===String(c.value));
    case 'neq': return arr.length>0&&!arr.some(x=>String(x)===String(c.value));
    case 'gt':{const n=parseFloat(String(v).replace(/[, ]/g,''));return !isNaN(n)&&n>c.value;}
    case 'containsAny': return arr.some(x=>c.value.includes(String(x)));
    case 'notContains': return arr.length>0&&!arr.some(x=>String(x)===String(c.value));
    default: return true;
  }
}
function visible(item){const s=item.showIf||item.cond;if(!s)return true;
  if(s.all)return s.all.every(testCond);if(s.any)return s.any.some(testCond);return true;}
const activeQs=()=>DATA.questions.filter(visible);
const triggeredCons=()=>DATA.considerations.filter(visible);
function calcProgress(){
  const act=activeQs(),done=act.filter(x=>hasAns(x.ref)).length;
  return {total:act.length,answered:done,flagged:triggeredCons().length};
}

async function initAuth(){
  render('loading');
  const {data:{session}}=await sb.auth.getSession();
  if(session){currentUser=session.user;render('sessions');}
  else{render('login');}
  sb.auth.onAuthStateChange((_e,s)=>{
    currentUser=s?.user||null;
    if(!currentUser&&appState!=='login')render('login');
  });
}

async function doLogin(e){
  e.preventDefault();
  const email=document.getElementById('l-email').value.trim();
  const pwd=document.getElementById('l-pwd').value;
  const err=document.getElementById('l-err');
  const btn=document.getElementById('l-btn');
  err.classList.remove('show');btn.disabled=true;btn.textContent='Signing in…';
  const {error}=await sb.auth.signInWithPassword({email,password:pwd});
  btn.disabled=false;btn.textContent='Sign in';
  if(error){err.textContent=error.message;err.classList.add('show');}
  else{render('sessions');}
}

async function doLogout(){
  await sb.auth.signOut();
  currentSession=null;S={answers:{},notes:{},optionOverrides:{},meta:{}};
  render('login');
}

let sessions=[];
let sessFilter='', sessSort='updated';

async function loadSessions(){
  const{data,error}=await sb.from('sessions').select(
    'id,client_name,consultant_name,session_date,status,progress_total,progress_answered,considerations_flagged,created_at,updated_at'
  ).order('updated_at',{ascending:false});
  if(error){toast('Could not load sessions: '+error.message,4000);return;}
  sessions=data||[];
}

function filteredSessions(){
  let list=sessions.slice();
  if(sessFilter){const f=sessFilter.toLowerCase();
    list=list.filter(s=>s.client_name.toLowerCase().includes(f)||
      s.consultant_name.toLowerCase().includes(f));}
  if(sessSort==='client')list.sort((a,b)=>a.client_name.localeCompare(b.client_name));
  else if(sessSort==='progress')list.sort((a,b)=>
    (b.progress_answered/Math.max(b.progress_total,1))-(a.progress_answered/Math.max(a.progress_total,1)));
  return list;
}

function sessCard(s){
  const pct=s.progress_total>0?Math.round(s.progress_answered/s.progress_total*100):0;
  return`<div class="sess-card ${s.status}" data-id="${s.id}">
    <div class="sc-head">
      <h3>${esc(s.client_name||'Untitled')}</h3>
      <div style="display:flex;align-items:center;gap:7px">
        <span class="status-pill ${s.status}">${s.status}</span>
        <button class="sc-del sc-actions" data-del="${s.id}" title="Delete">🗑</button>
      </div>
    </div>
    <div class="sc-meta">
      ${s.consultant_name?`<span>👤 ${esc(s.consultant_name)}</span>`:''}
      ${s.session_date?`<span>📅 ${esc(s.session_date)}</span>`:''}
      <span>🕐 Updated ${timeAgo(s.updated_at)}</span>
    </div>
    <div class="sess-pbar"><i style="width:${pct}%"></i></div>
    <div class="sc-foot">
      <span class="pct">${s.progress_answered}/${s.progress_total} answered · ${pct}%</span>
      ${s.considerations_flagged?`<span class="flags">⚠ ${s.considerations_flagged} flag${s.considerations_flagged!==1?'s':''}</span>`:''}
    </div>
  </div>`;
}

async function openSession(id){
  render('loading');
  const{data,error}=await sb.from('sessions').select('*').eq('id',id).single();
  if(error){toast('Could not load session: '+error.message,4000);render('sessions');return;}
  currentSession=data;
  S={
    answers:data.answers||{},
    notes:data.notes||{},
    optionOverrides:data.option_overrides||{},
    meta:{client:data.client_name||'',consultant:data.consultant_name||'',date:data.session_date||''}
  };
  qView='interview';qSearch='';showGated=false;onlyUnanswered=false;prevVisible=new Set();
  render('questionnaire');
}

async function deleteSession(id){
  if(!confirm('Permanently delete this session? This cannot be undone.'))return;
  const{error}=await sb.from('sessions').delete().eq('id',id);
  if(error){toast('Delete failed: '+error.message,4000);return;}
  sessions=sessions.filter(s=>s.id!==id);
  renderSessionList();
  toast('Session deleted');
}

function openNewSession(){
  document.getElementById('ns-client').value='';
  document.getElementById('ns-consultant').value='';
  document.getElementById('ns-date').value=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  document.getElementById('ns-err').classList.remove('show');
  document.getElementById('new-session-overlay').classList.add('open');
  document.getElementById('ns-client').focus();
}

async function createSession(){
  const client=document.getElementById('ns-client').value.trim();
  const consultant=document.getElementById('ns-consultant').value.trim();
  const date=document.getElementById('ns-date').value.trim();
  const err=document.getElementById('ns-err');
  if(!client){err.textContent='Client name is required.';err.classList.add('show');return;}
  err.classList.remove('show');
  document.getElementById('ns-create').disabled=true;
  document.getElementById('ns-create').textContent='Creating…';
  const{data,error}=await sb.from('sessions').insert({
    user_id:currentUser.id,client_name:client,consultant_name:consultant,
    session_date:date,status:'draft',answers:{},notes:{},option_overrides:{},
    progress_total:0,progress_answered:0,considerations_flagged:0
  }).select().single();
  document.getElementById('ns-create').disabled=false;
  document.getElementById('ns-create').textContent='Create';
  if(error){err.textContent='Could not create session: '+error.message;err.classList.add('show');return;}
  document.getElementById('new-session-overlay').classList.remove('open');
  sessions.unshift(data);
  await openSession(data.id);
}

function scheduleSave(){
  clearTimeout(saveTimer);
  setSaveStatus('saving');
  saveTimer=setTimeout(flushSave,1500);
}

function setSaveStatus(state){
  saveState=state;
  const el=document.getElementById('save-status');if(!el)return;
  const msgs={idle:'',saving:'Saving…',saved:'All changes saved',error:'Save failed'};
  el.className='save-status '+state;
  el.innerHTML=`<span class="dot"></span>${msgs[state]}`;
}

async function flushSave(){
  if(!currentSession)return;
  const p=calcProgress();
  const{error}=await sb.from('sessions').update({
    answers:S.answers,notes:S.notes,option_overrides:S.optionOverrides,
    client_name:S.meta.client||currentSession.client_name,
    consultant_name:S.meta.consultant||'',
    session_date:S.meta.date||'',
    status:currentSession.status,
    progress_total:p.total,progress_answered:p.answered,considerations_flagged:p.flagged,
  }).eq('id',currentSession.id);
  if(error){setSaveStatus('error');toast('Save failed — check your connection',4000);}
  else{setSaveStatus('saved');}
}

async function markComplete(){
  if(!currentSession)return;
  if(!confirm('Mark this session as complete?'))return;
  currentSession.status='complete';
  await flushSave();
  toast('Session marked complete');
  renderSidebar();
}

function render(state){
  if(state)appState=state;
  const root=document.getElementById('root');
  if(appState==='loading'){root.innerHTML=`
    <div class="loading-screen"><div class="spinner"></div><p>Loading…</p></div>`;return;}
  if(appState==='login'){root.innerHTML=renderLogin();
    document.getElementById('l-form').onsubmit=doLogin;return;}
  if(appState==='sessions'){
    root.innerHTML=renderSessionsShell();
    bindSessionShell();loadSessions().then(renderSessionList);return;}
  if(appState==='questionnaire'){
    root.innerHTML=renderQShell();
    renderQContent();renderSidebar();bindQ();return;}
}

function renderSidebar(){
  const act=activeQs();
  const nav=document.getElementById('nav');if(!nav)return;
  const tiers=[['gate','TIER 1'],['business','TIER 2'],['modules','TIER 3 — MODULES']];
  let h=`<a href="#" class="${qView==='interview'?'active':''}" data-v="interview">📋 Guided Interview</a>`;
  h+=`<a href="#" class="${qView==='dashboard'?'active':''}" data-v="dashboard">📊 Dashboard</a>`;
  const flagged=triggeredCons().length;
  h+=`<a href="#" class="${qView==='cons'?'active':''} ${flagged?'flagged':''}" data-v="cons">⚠️ Considerations <span class="cnt">${flagged}</span></a>`;
  tiers.forEach(([t,label])=>{
    h+=`<div class="nav-group">${label}</div>`;
    DATA.groups.filter(g=>g.tier===t).forEach(g=>{
      const qs=act.filter(x=>x.group===g.id);if(!qs.length)return;
      const done=qs.filter(x=>hasAns(x.ref)).length;
      h+=`<a href="#" class="${qView===g.id?'active':''} ${done===qs.length?'done':''}" data-v="${g.id}">
        ${esc(g.label)}<span class="cnt">${done}/${qs.length}</span></a>`;
    });
  });
  nav.innerHTML=h;
  nav.querySelectorAll('a').forEach(a=>a.onclick=e=>{e.preventDefault();qView=a.dataset.v;
    document.getElementById('sidebar').classList.remove('open');renderQContent();window.scrollTo(0,0);});
  const p=calcProgress();
  const pct=p.total?Math.round(p.answered/p.total*100):0;
  const pf=document.getElementById('pfill');if(pf)pf.style.width=pct+'%';

function qCard(x){
  const isVis=visible(x),a=ans(x.ref),answered=hasAns(x.ref);
  const opts=optsFor(x.ref);
  const multi=x.atype==='Multi select';
  let field='';
  if(opts.length&&!multi){
    field=`<div class="field">
      <select data-ref="${x.ref}">
        <option value="">— select —</option>
        ${opts.map(o=>`<option ${String(a)===o?'selected':''}>${esc(o)}</option>`).join('')}
      </select>
      <button class="editopts" data-edit="${x.ref}">Edit options</button></div>`;
  }else if(multi){
    const sel=Array.isArray(a)?a:[];
    field=`<div class="multi">${opts.map(o=>
      `<button class="opt ${sel.includes(o)?'sel':''}" data-multi="${x.ref}" data-val="${esc(o)}">${esc(o)}</button>`
    ).join('')}<button class="editopts" data-edit="${x.ref}">Edit options</button></div>`;
  }else if(x.atype==='Number'){
    field=`<input type="number" data-ref="${x.ref}" value="${esc(a||'')}" placeholder="Enter a number">`;
  }else{
    field=`<textarea data-ref="${x.ref}" placeholder="Type the answer…">${esc(a||'')}</textarea>`;
  }
  return`<div class="q ${answered?'answered':''} ${isVis?'':'gated'}" data-ref-id="${x.ref}">
    <div class="q-top"><span class="ref">${esc(x.ref)}</span><div class="qtext">${esc(x.question)}</div></div>
    <p class="why">${esc(x.why)}</p>
    <div class="tags">
      <span class="tag type">${esc(x.atype)}</span>
      ${x.triggerText&&!/^always/i.test(x.triggerText)?`<span class="tag trig">IF · ${esc(x.triggerText)}</span>`:''}
      ${x.routing?`<span class="tag route">→ ${esc(x.routing)}</span>`:''}
    </div>
    ${!isVis?`<div class="gatenote"><b>Not currently applicable</b> — trigger condition not yet met.</div>`:''}
    <div class="answer"><span class="lbl">ANSWER</span>${field}
      ${x.guidance?`<p class="why" style="margin-top:6px">${esc(x.guidance)}</p>`:''}</div>
    <div class="notes"><span class="lbl">NOTES</span>
      <textarea data-note="${x.ref}" placeholder="Context, who said it, follow-ups…">${esc(S.notes[x.ref]||'')}</textarea></div>
    ${x.considerations?`<div class="cons"><b>Consideration:</b> ${esc(x.considerations)}</div>`:''}
  </div>`;
}

function renderQContent(){
  const el=document.getElementById('content');if(!el)return;
  const nowVisible=new Set(DATA.questions.filter(visible).map(q=>q.ref));
  const newlyVisible=qView==='interview'?[...nowVisible].filter(r=>prevVisible.size&&!prevVisible.has(r)):[];
  prevVisible=nowVisible;
  const savedY=qView==='interview'?window.scrollY:0;
  if(qView==='dashboard')el.innerHTML=viewDash();
  else if(qView==='cons')el.innerHTML=viewCons();
  else if(qView==='interview')el.innerHTML=viewInterview();
  else el.innerHTML=viewQuestions(qView);
  bindQContent();
  if(qView==='interview'&&savedY>0)requestAnimationFrame(()=>window.scrollTo({top:savedY,behavior:'instant'}));
  if(newlyVisible.length){
    requestAnimationFrame(()=>{
      newlyVisible.forEach(ref=>{
        const card=document.querySelector(`.q[data-ref-id="${ref}"]`);
        if(card){card.classList.add('q-new');
          card.scrollIntoView({behavior:'smooth',block:'center'});}
      });
    });
  }
}

function viewQuestions(gid){
  const g=DATA.groups.find(x=>x.id===gid);
  let list=DATA.questions.filter(x=>x.group===gid);
  if(!showGated)list=list.filter(visible);
  if(onlyUnanswered)list=list.filter(x=>!hasAns(x.ref));
  if(qSearch){const t=qSearch.toLowerCase();
    list=list.filter(x=>(x.question+x.why+x.ref+x.considerations+x.section).toLowerCase().includes(t));}
  const all=DATA.questions.filter(x=>x.group===gid&&visible(x));
  const done=all.filter(x=>hasAns(x.ref)).length;
  return`<div class="head">
      <div class="kicker">${g.tier==='gate'?'TIER 1':g.tier==='business'?'TIER 2':'TIER 3 · MODULE'}</div>
      <h2>${esc(g.label)}</h2>
      <p>${done} of ${all.length} applicable questions answered.</p></div>
    <div class="toolrow">
      <button class="chip ${showGated?'on':''}" id="tg-gated">Show all questions</button>
      <button class="chip ${onlyUnanswered?'on':''}" id="tg-unans">Unanswered only</button>
    </div>
    ${list.length?list.map(qCard).join(''):`<div class="empty"><b>Nothing to show</b>
      Every applicable question is answered, or your filters exclude them all.</div>`}`;
}

function viewInterview(){
  const GORDER=['gate','business','M1','M2','M3','M4','M5','M6','M7','M8','M9','M10','M11','M12','M13','M14'];
  const sorted=DATA.questions.slice().sort((a,b)=>{
    const ai=GORDER.indexOf(a.group),bi=GORDER.indexOf(b.group);
    if(ai!==bi)return ai-bi;
    return DATA.questions.indexOf(a)-DATA.questions.indexOf(b);
  });
  let list=sorted.filter(visible);
  if(onlyUnanswered)list=list.filter(x=>!hasAns(x.ref));
  if(qSearch){const t=qSearch.toLowerCase();
    list=list.filter(x=>(x.question+x.ref+x.why+x.section).toLowerCase().includes(t));}
  const p=calcProgress(),pct=p.total?Math.round(p.answered/p.total*100):0;
  let lastGroup=null;
  const cards=list.map(q=>{
    let hdr='';
    if(q.group!==lastGroup){
      lastGroup=q.group;
      const g=DATA.groups.find(x=>x.id===q.group);
      const tier=q.tier==='gate'?'TIER 1 · QUALIFYING GATE':q.tier==='business'?'TIER 2 · BUSINESS DISCOVERY':'TIER 3 · MODULE';
      hdr=`<div class="int-group-head">${tier} &nbsp;—&nbsp; ${esc(g?.label||q.group)}</div>`;
    }
    return hdr+qCard(q);
  }).join('');
  const allDone=p.answered===p.total&&p.total>0;
  return`<div class="head">
      <div class="kicker">GUIDED INTERVIEW · ${p.answered} of ${p.total} applicable questions answered</div>
      <h2 style="font-size:20px;margin-top:4px">${esc(currentSession?.client_name||'Discovery')}</h2>
    </div>
    <div class="toolrow" style="margin-bottom:4px">
      <button class="chip ${onlyUnanswered?'on':''}" id="tg-unans">Unanswered only</button>
    </div>
    ${list.length?cards:`<div class="empty"><b>Nothing to show</b>Every applicable question is answered.</div>`}
    ${allDone?`<div class="int-complete">
      <div style="font-size:32px">✓</div>
      <b>All applicable questions answered</b>
      <p>Use <b>Export</b> in the toolbar to download a summary, or click <b>Mark complete</b> in the sidebar.</p>
    </div>`:''}
    <div style="height:90px"></div>
    <div class="ifloat">
      <div class="ibar"><i style="width:${pct}%"></i></div>
      <span class="ipct">${p.answered} / ${p.total}</span>
      <button class="btn primary" id="next-q">${allDone?'✓ All done':'Next unanswered ↓'}</button>
    </div>`;
}

function viewCons(){
  const on=triggeredCons();
  return`<div class="head"><div class="kicker">CONSTRAINT ANALYSIS</div>
    <h2>Considerations</h2>
    <p>Platform limits triggered by your Tier 1 answers.${on.length?` <b>${on.length} currently triggered.</b>`:' None triggered yet.'}</p></div>
    ${DATA.considerations.map(c=>{const t=visible(c);
      return`<div class="cons-card ${t?'on':''}">
        <div style="display:flex;gap:10px;align-items:center">
          <span class="ref">${esc(c.ref)}</span>
          <span class="status ${t?'on':'off'}">${t?'TRIGGERED':'NOT TRIGGERED'}</span></div>
        <h4>${esc(c.trigger)}</h4>
        <p class="why">${esc(c.constraint)}</p>
        <div class="act"><b>Recommended action:</b> ${esc(c.action)}</div></div>`;}).join('')}`;
}

function viewDash(){
  const p=calcProgress(),pct=p.total?Math.round(p.answered/p.total*100):0;
  const rows=DATA.groups.map(g=>{
    const qs=activeQs().filter(x=>x.group===g.id);if(!qs.length)return '';
    const d=qs.filter(x=>hasAns(x.ref)).length,pc=Math.round(d/qs.length*100);
    return`<tr><td><a href="#" data-goto="${g.id}">${esc(g.label)}</a></td>
      <td>${qs.length}</td><td>${d}</td><td>${qs.length-d}</td>
      <td><div style="display:flex;gap:9px;align-items:center">
        <div class="mini"><i style="width:${pc}%"></i></div>
        <span style="font-size:12px;color:var(--muted);min-width:32px">${pc}%</span></div></td></tr>`;}).join('');
  return`<div class="head"><div class="kicker">SESSION DASHBOARD</div>
      <h2>${esc(currentSession?.client_name||'Discovery')}</h2>
      <p>Changes save automatically. Use <b>Export</b> to download a copy.</p></div>
    <div class="cards">
      <div class="card"><div class="n">${p.answered}</div><div class="l">Answered</div></div>
      <div class="card"><div class="n">${p.total-p.answered}</div><div class="l">Outstanding</div></div>
      <div class="card"><div class="n">${pct}%</div><div class="l">Complete</div></div>
      <div class="card ${p.flagged?'alert':''}"><div class="n">${p.flagged}</div><div class="l">Flags</div></div>
    </div>
    <div class="head" style="margin-top:6px"><h2 style="font-size:19px">Session details</h2></div>
    <div class="cards" style="grid-template-columns:repeat(auto-fit,minmax(215px,1fr));margin-bottom:24px">
      <div class="card"><span class="lbl">CLIENT</span>
        <input type="text" data-meta="client" value="${esc(S.meta.client||currentSession?.client_name||'')}" placeholder="Client name"></div>
      <div class="card"><span class="lbl">CONSULTANT</span>
        <input type="text" data-meta="consultant" value="${esc(S.meta.consultant||currentSession?.consultant_name||'')}" placeholder="Your name"></div>
      <div class="card"><span class="lbl">DATE</span>
        <input type="text" data-meta="date" value="${esc(S.meta.date||currentSession?.session_date||'')}" placeholder="e.g. 24 Aug 2026"></div>
    </div>
    <div class="head"><h2 style="font-size:19px">Progress by section</h2></div>
    <table class="grid"><thead><tr><th>Section</th><th>Applicable</th><th>Answered</th>
      <th>Outstanding</th><th>Complete</th></tr></thead><tbody>${rows}</tbody></table>
    <p class="why" style="margin-top:14px">"Applicable" reflects conditional logic — questions whose trigger conditions aren't met are excluded automatically.</p>`;
}

function bindQContent(){
  document.querySelectorAll('[data-ref]').forEach(n=>{
    const ev=n.tagName==='SELECT'?'change':'input';
    n.addEventListener(ev,()=>{
      const r=n.dataset.ref,v=n.value;
      if(v===''||v===null)delete S.answers[r];else S.answers[r]=v;
      scheduleSave();
      if(n.tagName==='SELECT'){renderQContent();renderSidebar();}
      else{renderSidebar();n.closest('.q')?.classList.toggle('answered',hasAns(r));}
    });
  });
  document.querySelectorAll('[data-multi]').forEach(b=>b.onclick=()=>{
    const r=b.dataset.multi,v=b.dataset.val;
    const cur=Array.isArray(S.answers[r])?S.answers[r].slice():[];
    const i=cur.indexOf(v);i>=0?cur.splice(i,1):cur.push(v);
    if(cur.length)S.answers[r]=cur;else delete S.answers[r];
    scheduleSave();renderQContent();renderSidebar();
  });
  document.querySelectorAll('[data-note]').forEach(n=>n.addEventListener('input',()=>{
    const r=n.dataset.note,v=n.value;
    if(v.trim())S.notes[r]=v;else delete S.notes[r];scheduleSave();}));
  document.querySelectorAll('[data-meta]').forEach(n=>n.addEventListener('input',()=>{
    S.meta[n.dataset.meta]=n.value;scheduleSave();}));
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openOpts(b.dataset.edit));
  document.querySelectorAll('[data-goto]').forEach(a=>a.onclick=e=>{
    e.preventDefault();qView=a.dataset.goto;renderQContent();window.scrollTo(0,0);});
  const tg=document.getElementById('tg-gated');if(tg)tg.onclick=()=>{showGated=!showGated;renderQContent();};
  const tu=document.getElementById('tg-unans');if(tu)tu.onclick=()=>{onlyUnanswered=!onlyUnanswered;renderQContent();};
  const nq=document.getElementById('next-q');
  if(nq)nq.onclick=()=>{
    const cards=[...document.querySelectorAll('.q:not(.gated)')];
    const next=cards.find(c=>!c.classList.contains('answered'));
    if(next){
      next.scrollIntoView({behavior:'smooth',block:'center'});
      setTimeout(()=>{
        const inp=next.querySelector('select,input[type=number],textarea');
        if(inp)inp.focus();
      },420);
    }else{toast('All applicable questions answered! 🎉',3000);}
  };
}

function bindQ(){
  bindQContent();
  document.getElementById('burger').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('back-btn').onclick=async()=>{
    await flushSave();currentSession=null;S={answers:{},notes:{},optionOverrides:{},meta:{}};
    render('sessions');loadSessions().then(renderSessionList);};
  document.getElementById('complete-btn').onclick=markComplete;
  document.getElementById('q').oninput=e=>{qSearch=e.target.value;
    if(qView==='dashboard'||qView==='cons')qView='interview';renderQContent();};
  document.getElementById('x-json').onclick=exportJSON;
  document.getElementById('x-csv').onclick=exportCSV;
  document.getElementById('x-print').onclick=()=>window.print();
  const mb=document.getElementById('menubtn'),mn=document.getElementById('menu');
  mb.onclick=e=>{e.stopPropagation();mn.classList.toggle('open');};
  document.addEventListener('click',()=>mn?.classList.remove('open'));
  document.getElementById('m-cancel').onclick=closeOpts;
  document.getElementById('overlay').onclick=e=>{if(e.target.id==='overlay')closeOpts();};
  document.getElementById('m-reset').onclick=()=>{if(editing){delete S.optionOverrides[editing];
    scheduleSave();drawOpts(byRef[editing].options.slice());toast('Reset to defaults');}};
  document.getElementById('m-save').onclick=saveOpts;
}

let editing=null;
function openOpts(ref){
  editing=ref;const x=byRef[ref];
  document.getElementById('m-title').textContent='Edit dropdown options';
  document.getElementById('m-sub').textContent=x.ref+' · '+x.question;
  drawOpts(optsFor(ref).slice());
  document.getElementById('overlay').classList.add('open');
}
function drawOpts(list){
  const bd=document.getElementById('m-body');
  bd.innerHTML=list.map((o,i)=>`<div class="optrow">
      <input type="text" value="${esc(o)}" data-i="${i}">
      <button class="iconbtn" data-up="${i}" ${i===0?'disabled':''}>↑</button>
      <button class="iconbtn" data-down="${i}" ${i===list.length-1?'disabled':''}>↓</button>
      <button class="iconbtn del" data-del="${i}">✕</button></div>`).join('')
    +`<button class="btn" id="m-add" style="margin-top:6px">+ Add option</button>`;
  const get=()=>Array.from(bd.querySelectorAll('input[data-i]')).map(n=>n.value);
  bd.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const l=get();l.splice(+b.dataset.del,1);drawOpts(l);});
  bd.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const l=get(),i=+b.dataset.up;
    [l[i-1],l[i]]=[l[i],l[i-1]];drawOpts(l);});
  bd.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>{const l=get(),i=+b.dataset.down;
    [l[i+1],l[i]]=[l[i],l[i+1]];drawOpts(l);});
  document.getElementById('m-add').onclick=()=>{const l=get();l.push('');drawOpts(l);
    const ins=bd.querySelectorAll('input[data-i]');ins[ins.length-1].focus();};
}
function closeOpts(){document.getElementById('overlay')?.classList.remove('open');editing=null;}
function saveOpts(){
  const list=Array.from(document.querySelectorAll('#m-body input[data-i]'))
    .map(n=>n.value.trim()).filter(Boolean);
  if(editing){
    const cur=ans(editing);
    if(Array.isArray(cur)){const k=cur.filter(v=>list.includes(v));
      if(k.length)S.answers[editing]=k;else delete S.answers[editing];}
    else if(cur&&!list.includes(cur))delete S.answers[editing];
    S.optionOverrides[editing]=list;scheduleSave();
  }
  closeOpts();renderQContent();renderSidebar();toast('Options updated');
}

function exportJSON(){
  const name=(S.meta.client||currentSession?.client_name||'session').replace(/\W+/g,'-').toLowerCase();
  download(`discovery-${name}.json`,JSON.stringify({
    sessionId:currentSession?.id,client:S.meta.client||currentSession?.client_name,
    consultant:S.meta.consultant||currentSession?.consultant_name,
    date:S.meta.date||currentSession?.session_date,
    exportedAt:new Date().toISOString(),answers:S.answers,notes:S.notes,
    optionOverrides:S.optionOverrides},null,2),'application/json');
  toast('Session exported');
}
function exportCSV(){
  const name=(S.meta.client||currentSession?.client_name||'session').replace(/\W+/g,'-').toLowerCase();
  const rows=[['Ref','Section','Question','Answer Type','Applicable','Answer','Notes','Trigger','Routing','Considerations']];
  DATA.questions.forEach(x=>{const a=ans(x.ref);
    rows.push([x.ref,x.section,x.question,x.atype,visible(x)?'Yes':'No',
      Array.isArray(a)?a.join('; '):(a||''),S.notes[x.ref]||'',x.triggerText,x.routing,x.considerations]);});
  rows.push([]);rows.push(['CONSIDERATIONS']);
  rows.push(['Ref','Trigger','Status','Constraint','Recommended Action']);
  DATA.considerations.forEach(c=>rows.push([c.ref,c.trigger,visible(c)?'TRIGGERED':'Not triggered',c.constraint,c.action]));
  const csv=rows.map(r=>r.map(v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  download(`discovery-${name}.csv`,'\ufeff'+csv,'text/csv');
  toast('CSV exported');
}

initAuth();
</script>
</body>
</html>
